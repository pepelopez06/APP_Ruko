        // ====================================================
        // ENTRENAMIENTO
        // ====================================================
        const TrainingTab = ({ usuario }) => {
            const [trainingDays, setTrainingDays] = useState(4);
            const [isConfigOpen, setIsConfigOpen] = useState(false);
            const [currentDay, setCurrentDay] = useState(1);
            const [routines, setRoutines] = useState({});
            const [nombresDias, setNombresDias] = useState(() => {
                const saved = localStorage.getItem('ruko_nombres_dias');
                return saved ? JSON.parse(saved) : { 1: "Pecho", 2: "Espalda", 3: "Piernas", 4: "Hombros" };
            });
            const [isAddingDB, setIsAddingDB] = useState(false);
            const [selectedMuscleGroup, setSelectedMuscleGroup] = useState("Pecho");
            const [busquedaEjercicio, setBusquedaEjercicio] = useState('');
            const [attendance, setAttendance] = useState(() => {
                const saved = localStorage.getItem(`ruko_asistencia_${usuario.Id}`);
                return saved ? JSON.parse(saved) : {};
            });

            const cargarDatos = () => {
                fetch(`/api/rutinas?usuarioId=${usuario.Id}`)
                    .then(res => res.json())
                    .then(data => {
                        const formatted = {};
                        data.forEach(item => {
                            const dia = item.diasemana || item.DiaSemana;
                            const idReg = item.id || item.Id;
                            const nombreEj = item.nombreep || item.nombreejercicio || item.NombreEjercicio;
                            const setsJ = item.setsjson || item.SetsJson;
                            if (!formatted[dia]) formatted[dia] = [];
                            formatted[dia].push({
                                dbId: idReg,
                                id: idReg,
                                name: nombreEj,
                                expanded: false,
                                sets: typeof setsJ === 'string' ? JSON.parse(setsJ) : (setsJ || [])
                            });
                        });
                        setRoutines(formatted);
                    })
                    .catch(err => console.error("Error al cargar rutinas:", err));

                fetch(`/api/asistencia?usuarioId=${usuario.Id}`)
                    .then(res => res.json())
                    .then(data => {
                        const attMap = { ...attendance };
                        data.forEach(item => {
                            const fechaVal = item.fecha || item.Fecha;
                            if (fechaVal) attMap[fechaVal.split('T')[0]] = true;
                        });
                        setAttendance(attMap);
                        localStorage.setItem(`ruko_asistencia_${usuario.Id}`, JSON.stringify(attMap));
                    })
                    .catch(err => console.error("Error al cargar asistencia:", err));
            };

            useEffect(() => { cargarDatos(); }, []);

            const activeRoutine = routines[currentDay] || [];

            const registrarHistorialAutomatico = (nombreEjercicio, sets) => {
                const maxPeso = Math.max(...sets.map(s => Number(s.weight) || 0));
                if (maxPeso <= 0) return;
                const now = new Date();
                const fechaHoy = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                fetch('/api/historial-cargas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuarioId: usuario.Id, fecha: fechaHoy, ejercicio: nombreEjercicio, pesoMaximo: maxPeso })
                }).catch(err => console.error("Error al registrar historial automático:", err));
            };

            const toggleExpand = (exId) => {
                setRoutines(prev => ({
                    ...prev,
                    [currentDay]: (prev[currentDay] || []).map(ex => ex.id === exId ? { ...ex, expanded: !ex.expanded } : ex)
                }));
            };

            // Aplica un cambio de series: actualiza estado, guarda en BD y registra historial
            const mutateSets = (exId, buildSets, trackHistory = true) => {
                setRoutines(prev => {
                    const list = (prev[currentDay] || []).map(ex => {
                        if (ex.id !== exId) return ex;
                        const newSets = buildSets(ex.sets);
                        fetch(`/api/rutinas/${ex.dbId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ setsJson: JSON.stringify(newSets) })
                        }).catch(err => console.error("Error al actualizar sets:", err));
                        if (trackHistory) registrarHistorialAutomatico(ex.name, newSets);
                        return { ...ex, sets: newSets };
                    });
                    return { ...prev, [currentDay]: list };
                });
            };

            const addSet = (exId) => mutateSets(exId, sets => [...sets, { ...(sets[sets.length - 1] || { reps: 10, weight: 0 }) }]);
            const removeSet = (exId, idx) => mutateSets(exId, sets => sets.filter((_, i) => i !== idx));
            const updateSet = (exId, idx, field, value) =>
                mutateSets(exId, sets => sets.map((s, i) => i === idx ? { ...s, [field]: value === '' ? '' : Number(value) } : s), field === 'weight');

            const agregarEjercicioDirecto = (exerciseName) => {
                fetch('/api/rutinas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuario.Id,
                        diaSemana: currentDay,
                        ejercicio: exerciseName,
                        setsJson: JSON.stringify([{ reps: 10, weight: 0 }])
                    })
                })
                    .then(res => res.json())
                    .then(() => { setIsAddingDB(false); setBusquedaEjercicio(''); cargarDatos(); })
                    .catch(err => console.error("Error al guardar ejercicio:", err));
            };

            const removeExercise = (dbId) => {
                fetch(`/api/rutinas/${dbId}`, { method: 'DELETE' })
                    .then(() => {
                        setRoutines(prev => ({
                            ...prev,
                            [currentDay]: (prev[currentDay] || []).filter(ex => ex.dbId !== dbId)
                        }));
                    })
                    .catch(err => console.error("Error al eliminar ejercicio:", err));
            };

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const toggleAttendanceDay = (dayNum) => {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                const nuevoEstado = !attendance[dateKey];
                const nuevo = { ...attendance, [dateKey]: nuevoEstado };
                setAttendance(nuevo);
                localStorage.setItem(`ruko_asistencia_${usuario.Id}`, JSON.stringify(nuevo));
                fetch('/api/asistencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuarioId: usuario.Id, fecha: dateKey, asistio: nuevoEstado })
                }).catch(err => console.error("Error al actualizar asistencia:", err));
            };

            let listaFiltrada = [];
            if (busquedaEjercicio.trim() !== '') {
                Object.entries(exerciseDatabase).forEach(([muscle, lista]) => {
                    lista.filter(ex => ex.toLowerCase().includes(busquedaEjercicio.toLowerCase()))
                        .forEach(ex => listaFiltrada.push({ muscle, ex }));
                });
            } else if (selectedMuscleGroup && exerciseDatabase[selectedMuscleGroup]) {
                exerciseDatabase[selectedMuscleGroup].forEach(ex => listaFiltrada.push({ muscle: selectedMuscleGroup, ex }));
            }

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start pb-24 lg:pb-4">
                    {/* Configuración semanal */}
                    <div className={`${CARD} overflow-hidden`}>
                        <div onClick={() => setIsConfigOpen(!isConfigOpen)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-graphite-700/30 transition-colors">
                            <div className="flex items-center space-x-3">
                                <div className="bg-neon-500/10 text-neon-500 p-2 rounded-lg"><Icons.Settings /></div>
                                <div>
                                    <h2 className="text-base font-bold text-white">Configuración Semanal</h2>
                                    <p className="text-xs text-graphite-400">{trainingDays} días de entrenamiento configurados</p>
                                </div>
                            </div>
                            <div className={`transform transition-transform ${isConfigOpen ? 'rotate-180' : ''} text-graphite-400`}><Icons.ChevronDown /></div>
                        </div>
                        {isConfigOpen && (
                            <div className="p-4 bg-graphite-900/60 border-t border-graphite-700">
                                <div className="flex items-center space-x-3 bg-graphite-900 p-3 rounded-xl border border-graphite-700">
                                    <label className="text-sm font-medium text-graphite-300 w-full">¿Cuántos días vas a ir al gym?</label>
                                    <select
                                        value={trainingDays}
                                        onChange={(e) => {
                                            setTrainingDays(Number(e.target.value));
                                            if (currentDay > Number(e.target.value)) setCurrentDay(1);
                                        }}
                                        className="bg-graphite-800 text-white p-2 rounded outline-none border border-graphite-600 focus:border-neon-500 font-bold"
                                    >
                                        {[1, 2, 3, 4, 5, 6, 7].map(n => <option key={n} value={n}>{n} Días</option>)}
                                    </select>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Calendario de asistencia */}
                    <div className={`${CARD} p-5`}>
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center space-x-2">
                                <div className="text-neon-500 bg-neon-500/10 p-2 rounded-lg"><Icons.Calendar /></div>
                                <h3 className="font-bold text-white text-sm">Asistencia: {monthNames[month]} {year}</h3>
                            </div>
                            <span className="text-xs text-graphite-400 hidden sm:block">Toca para marcar</span>
                        </div>
                        <div className="grid grid-cols-7 gap-1.5 text-center">
                            {['L', 'M', 'Mi', 'J', 'V', 'S', 'D'].map((d, i) => <span key={i} className="text-[10px] font-bold text-graphite-500 mb-1">{d}</span>)}
                            {Array.from({ length: firstDayIndex }, (_, i) => <div key={`empty-${i}`} />)}
                            {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(dayNum => {
                                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                                const isChecked = !!attendance[dateKey];
                                return (
                                    <button
                                        key={dayNum}
                                        type="button"
                                        onClick={() => toggleAttendanceDay(dayNum)}
                                        className={`h-9 sm:h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all border cursor-pointer ${
                                            isChecked
                                                ? 'bg-neon-500 text-graphite-950 border-neon-400 neon-glow'
                                                : 'bg-graphite-900 text-graphite-400 border-graphite-700 hover:border-graphite-500'
                                        }`}
                                    >
                                        <span>{dayNum}</span>
                                        {isChecked && <span className="scale-75 -mt-0.5"><Icons.Check /></span>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Días de rutina */}
                    <div className="lg:col-span-2">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-graphite-400 mb-3">Tus Días de Rutina</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                            {Array.from({ length: trainingDays }, (_, i) => i + 1).map(day => (
                                <div
                                    key={day}
                                    onClick={() => setCurrentDay(day)}
                                    className={`p-4 rounded-2xl flex flex-col justify-between transition-all duration-300 shadow-lg border cursor-pointer ${
                                        currentDay === day
                                            ? 'bg-neon-500 text-graphite-950 border-neon-400 scale-[1.02] neon-glow'
                                            : 'bg-graphite-800 text-graphite-300 border-graphite-700 hover:bg-graphite-700/60'
                                    }`}
                                >
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-xs uppercase font-bold tracking-wider opacity-90">Día {day}</span>
                                        <span className={`text-[10px] px-2 py-0.5 rounded-full ${currentDay === day ? 'bg-graphite-950/20' : 'bg-black/30'}`}>{(routines[day] || []).length} ejerc.</span>
                                    </div>
                                    <input
                                        type="text"
                                        value={nombresDias[day] || ''}
                                        onChange={(e) => {
                                            const nuevos = { ...nombresDias, [day]: e.target.value };
                                            setNombresDias(nuevos);
                                            localStorage.setItem('ruko_nombres_dias', JSON.stringify(nuevos));
                                        }}
                                        onClick={(e) => e.stopPropagation()}
                                        placeholder="Nombre..."
                                        className={`w-full font-bold text-sm px-2 py-1 rounded outline-none text-center border ${
                                            currentDay === day
                                                ? 'bg-graphite-950/15 text-graphite-950 placeholder-graphite-700 border-graphite-950/30 focus:border-graphite-950'
                                                : 'bg-black/20 text-white border-white/20 focus:border-neon-500'
                                        }`}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>

                    <h3 className="lg:col-span-2 text-lg font-bold text-white mt-2 border-b border-graphite-700 pb-2 flex justify-between items-center">
                        <span>Rutina: Día {currentDay} ({nombresDias[currentDay] || 'Sin Nombre'})</span>
                        <span className="text-xs text-neon-500 font-normal">{activeRoutine.length} ejercicios</span>
                    </h3>

                    {/* Ejercicios */}
                    <div className="space-y-4 lg:col-span-2 lg:grid lg:grid-cols-2 lg:gap-4 lg:space-y-0 lg:items-start">
                        {activeRoutine.length === 0 ? (
                            <div className="lg:col-span-2 text-center py-10 bg-graphite-800 rounded-2xl border border-graphite-700 border-dashed">
                                <p className="text-graphite-400 text-sm">No hay ejercicios guardados en este día.</p>
                            </div>
                        ) : (
                            activeRoutine.map(exercise => (
                                <div key={exercise.dbId} className={`${CARD} overflow-hidden`}>
                                    <div className="p-4 flex justify-between items-center gap-3 cursor-pointer hover:bg-graphite-700/30 transition-colors" onClick={() => toggleExpand(exercise.id)}>
                                        <h3 className="font-bold text-white text-base min-w-0">{exercise.name}</h3>
                                        <div className="flex items-center space-x-3 shrink-0">
                                            <span className="text-xs bg-graphite-700 text-neon-500 px-2 py-1 rounded-full font-medium whitespace-nowrap">{exercise.sets.length} series</span>
                                            <div className={`transform transition-transform ${exercise.expanded ? 'rotate-180' : ''} text-graphite-400`}><Icons.ChevronDown /></div>
                                        </div>
                                    </div>

                                    {exercise.expanded && (
                                        <div className="p-4 bg-graphite-900/50 border-t border-graphite-700">
                                            <div className="grid grid-cols-12 gap-2 mb-2 text-xs font-semibold text-graphite-400 text-center px-1">
                                                <div className="col-span-2">SET</div>
                                                <div className="col-span-4">KG</div>
                                                <div className="col-span-4">REPS</div>
                                                <div className="col-span-2"></div>
                                            </div>
                                            {exercise.sets.map((set, idx) => (
                                                <div key={`set-${idx}`} className="grid grid-cols-12 gap-2 items-center mb-3">
                                                    <div className="col-span-2 text-center text-graphite-500 font-bold bg-graphite-800 py-2 rounded-lg text-sm">{idx + 1}</div>
                                                    <div className="col-span-4">
                                                        <input type="number" inputMode="decimal" value={set.weight} onChange={(e) => updateSet(exercise.id, idx, 'weight', e.target.value)}
                                                            className="w-full bg-graphite-800 text-white text-center py-2 rounded-lg outline-none focus:ring-2 focus:ring-neon-500 border border-graphite-700 font-bold" />
                                                    </div>
                                                    <div className="col-span-4">
                                                        <input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(exercise.id, idx, 'reps', e.target.value)}
                                                            className="w-full bg-graphite-800 text-white text-center py-2 rounded-lg outline-none focus:ring-2 focus:ring-neon-500 border border-graphite-700 font-bold" />
                                                    </div>
                                                    <div className="col-span-2 flex justify-center">
                                                        <button onClick={() => removeSet(exercise.id, idx)} className="text-red-400 hover:text-red-300 p-2 bg-red-400/10 rounded-lg cursor-pointer"><Icons.Trash2 /></button>
                                                    </div>
                                                </div>
                                            ))}
                                            <div className="flex space-x-2 mt-4">
                                                <button onClick={() => addSet(exercise.id)} className="flex-1 py-2 rounded-xl text-sm font-bold bg-graphite-700 text-white hover:bg-graphite-600 transition-colors cursor-pointer">+ Añadir Serie</button>
                                                <button onClick={() => removeExercise(exercise.dbId)} className={`py-2 px-4 rounded-xl text-sm font-bold ${BTN_DANGER}`}>Eliminar</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))
                        )}
                    </div>

                    <button
                        onClick={() => setIsAddingDB(true)}
                        className={`lg:col-span-2 w-full ${BTN_NEON} py-4 rounded-2xl neon-glow flex justify-center items-center space-x-2 mt-2`}
                    >
                        <Icons.Plus />
                        <span>Explorar Base de Ejercicios del Gym</span>
                    </button>

                    {isAddingDB && (
                        <div className={`lg:col-span-2 ${CARD} p-5 space-y-4`}>
                            <h3 className="text-white font-bold flex items-center justify-between">
                                <span className="flex items-center text-neon-500"><Icons.Dumbbell /> <span className="ml-2 text-white">Selecciona un Músculo o Busca</span></span>
                                <button onClick={() => setIsAddingDB(false)} className="text-xs text-graphite-400 hover:text-white cursor-pointer">Cerrar</button>
                            </h3>
                            <input type="text" placeholder="Busca un ejercicio..." value={busquedaEjercicio} onChange={(e) => setBusquedaEjercicio(e.target.value)}
                                className={`w-full ${INPUT} px-4 py-2.5 text-sm`} />
                            {!busquedaEjercicio && (
                                <div className="flex flex-wrap gap-2">
                                    {Object.keys(exerciseDatabase).map(muscle => (
                                        <button key={muscle} onClick={() => setSelectedMuscleGroup(muscle)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer ${
                                                selectedMuscleGroup === muscle ? 'bg-neon-500 text-graphite-950' : 'bg-graphite-700 text-graphite-300 hover:bg-graphite-600'
                                            }`}>
                                            {muscle}
                                        </button>
                                    ))}
                                </div>
                            )}
                            <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-2 hide-scrollbar lg:grid lg:grid-cols-2 lg:gap-2 lg:space-y-0">
                                {listaFiltrada.length === 0 ? (
                                    <p className="text-xs text-graphite-400 text-center py-4 lg:col-span-2">No se encontraron ejercicios.</p>
                                ) : (
                                    listaFiltrada.map((item, idx) => (
                                        <div key={idx} onClick={() => agregarEjercicioDirecto(item.ex)}
                                            className="w-full text-left p-3 rounded-xl bg-graphite-900 border border-graphite-700 hover:border-neon-500 text-sm text-white font-medium flex justify-between items-center gap-3 transition-colors cursor-pointer">
                                            <div className="min-w-0">
                                                <span>{item.ex}</span>
                                                <span className="block text-[10px] text-neon-500">{item.muscle}</span>
                                            </div>
                                            <span className="bg-neon-500/15 text-neon-500 p-2 rounded-lg shrink-0"><Icons.Plus /></span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ====================================================
        // NUTRICIÓN
        // ====================================================
        const NutritionTab = ({ usuario, setUsuario }) => {
            const [peso, setPeso] = useState(usuario.Peso || 75);
            const [altura, setAltura] = useState(usuario.Altura || 175);
            const [edad, setEdad] = useState(usuario.Edad || 20);
            const [actividad, setActividad] = useState(usuario.Actividad || 1.55);
            const [objetivo, setObjetivo] = useState(usuario.Objetivo || 'mantenimiento');

            const [busqueda, setBusqueda] = useState('');
            const [alimentos, setAlimentos] = useState([]);
            const [cargando, setCargando] = useState(false);
            const [cantidadesInputs, setCantidadesInputs] = useState({});
            const [tiposUnidad, setTiposUnidad] = useState({});
            const [alimentosConsumidos, setAlimentosConsumidos] = useState([]);

            const now = new Date();
            const fechaHoy = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const cargarConsumo = () => {
                fetch(`/api/consumo?usuarioId=${usuario.Id}&fecha=${fechaHoy}`)
                    .then(res => res.json())
                    .then(data => setAlimentosConsumidos(data))
                    .catch(err => console.error("Error al cargar consumo:", err));
            };

            useEffect(() => { cargarConsumo(); }, []);

            const guardarPerfil = (nv = {}) => {
                const p = nv.peso !== undefined ? nv.peso : peso;
                const a = nv.altura !== undefined ? nv.altura : altura;
                const e = nv.edad !== undefined ? nv.edad : edad;
                const act = nv.actividad !== undefined ? nv.actividad : actividad;
                const obj = nv.objetivo !== undefined ? nv.objetivo : objetivo;

                const actualizado = { ...usuario, Peso: p, Altura: a, Edad: e, Actividad: act, Objetivo: obj };
                localStorage.setItem('fitpro_usuario', JSON.stringify(actualizado));
                if (setUsuario) setUsuario(actualizado);

                fetch(`/api/usuario/${usuario.Id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peso: p, altura: a, edad: e, actividad: act, objetivo: obj })
                }).catch(err => console.error("Error al actualizar perfil:", err));
            };

            const tmb = (10 * peso) + (6.25 * altura) - (5 * edad) + 5;
            const mantenimiento = Math.round(tmb * actividad);
            const caloriasMeta = objetivo === 'volumen' ? mantenimiento + 300 : objetivo === 'definicion' ? mantenimiento - 400 : mantenimiento;
            const proteinasMeta = Math.round(peso * 2.0);
            const grasasMeta = Math.round((caloriasMeta * 0.25) / 9);
            const carbosMeta = Math.round((caloriasMeta - (proteinasMeta * 4) - (grasasMeta * 9)) / 4);

            const buscarAlimentos = (termino) => {
                setBusqueda(termino);
                if (termino.trim() === '') { setAlimentos([]); return; }
                setCargando(true);
                fetch(`/api/alimentos?buscar=${encodeURIComponent(termino)}`)
                    .then(res => res.json())
                    .then(data => {
                        setAlimentos(data);
                        const ic = {}, iu = {};
                        data.forEach(item => { const id = item.id || item.Id; ic[id] = 100; iu[id] = 'g'; });
                        setCantidadesInputs(ic);
                        setTiposUnidad(iu);
                        setCargando(false);
                    })
                    .catch(err => { console.error("Error al buscar alimentos:", err); setCargando(false); });
            };

            const handleCantidadChange = (id, v) => setCantidadesInputs({ ...cantidadesInputs, [id]: v === '' ? '' : Number(v) });
            const handleUnidadChange = (id, u) => setTiposUnidad({ ...tiposUnidad, [id]: u });

            const calcularFactorYDetalle = (id, item) => {
                const cant = Number(cantidadesInputs[id]) || 0;
                const unidad = tiposUnidad[id] || 'g';
                let gramos = cant;
                let texto = `${cant}g`;
                if (unidad === 'vasos') {
                    gramos = cant * 250;
                    texto = `${cant} vaso${cant !== 1 ? 's' : ''} (${gramos} ml)`;
                } else if (unidad === 'cucharadas') {
                    gramos = cant * 15;
                    texto = `${cant} cda${cant !== 1 ? 's' : ''} (${gramos} ml)`;
                }
                const factor = gramos / 100;
                const cal = item.calorias !== undefined ? item.calorias : item.Calorias;
                const pro = item.proteinas !== undefined ? item.proteinas : item.Proteinas;
                const car = item.carbohidratos !== undefined ? item.carbohidratos : item.Carbohidratos;
                const gra = item.grasas !== undefined ? item.grasas : item.Grasas;
                return {
                    factor,
                    textoMedida: texto,
                    calorias: Math.round(cal * factor),
                    proteinas: Number((pro * factor).toFixed(1)),
                    carbohidratos: Number((car * factor).toFixed(1)),
                    grasas: Number((gra * factor).toFixed(1))
                };
            };

            const agregarAlConsumo = (item) => {
                const itemId = item.id || item.Id;
                const calculo = calcularFactorYDetalle(itemId, item);
                fetch('/api/consumo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuario.Id,
                        fecha: fechaHoy,
                        nombre: item.nombre || item.Nombre,
                        medidaTexto: calculo.textoMedida,
                        calorias: calculo.calorias,
                        proteinas: calculo.proteinas,
                        carbohidratos: calculo.carbohidratos,
                        grasas: calculo.grasas
                    })
                })
                    .then(res => res.json())
                    .then(() => cargarConsumo())
                    .catch(err => console.error("Error al guardar consumo:", err));
            };

            const eliminarDelConsumo = (id) => {
                fetch(`/api/consumo/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => cargarConsumo())
                    .catch(err => console.error("Error al eliminar consumo:", err));
            };

            const pick = (o, a, b) => (o[a] !== undefined ? o[a] : (o[b] || 0));
            const totalCalorias = alimentosConsumidos.reduce((s, c) => s + pick(c, 'calorias', 'Calorias'), 0);
            const totalProteinas = alimentosConsumidos.reduce((s, c) => s + pick(c, 'proteinas', 'Proteinas'), 0);
            const totalCarbos = alimentosConsumidos.reduce((s, c) => s + pick(c, 'carbohidratos', 'Carbohidratos'), 0);
            const totalGrasas = alimentosConsumidos.reduce((s, c) => s + pick(c, 'grasas', 'Grasas'), 0);
            const progresoCal = Math.min(100, caloriasMeta > 0 ? (totalCalorias / caloriasMeta) * 100 : 0);

            const objBtn = (key, label) => (
                <button onClick={() => { setObjetivo(key); guardarPerfil({ objetivo: key }); }}
                    className={`py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${objetivo === key ? 'bg-neon-500 text-graphite-950 neon-glow' : 'bg-graphite-900 text-graphite-400 border border-graphite-700'}`}>
                    {label}
                </button>
            );

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start pb-24 lg:pb-4">
                    {/* Calculadora */}
                    <div className={`${CARD} p-5`}>
                        <div className="flex items-center space-x-3 mb-4">
                            <div className={ICON_BOX}><Icons.Apple /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">Calculadora Nutricional</h2>
                                <p className="text-graphite-400 text-sm">Basado en tus datos y nivel de actividad</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-3 mb-4">
                            {[
                                ['Peso (kg)', peso, setPeso, 'peso'],
                                ['Altura (cm)', altura, setAltura, 'altura'],
                                ['Edad', edad, setEdad, 'edad']
                            ].map(([label, val, setter, key]) => (
                                <div key={key}>
                                    <label className="text-xs text-graphite-400 block mb-1">{label}</label>
                                    <input type="number" inputMode="decimal" value={val}
                                        onChange={(e) => { const v = Number(e.target.value); setter(v); guardarPerfil({ [key]: v }); }}
                                        className={`w-full ${INPUT} p-2 font-bold text-center`} />
                                </div>
                            ))}
                        </div>

                        <div className="mb-4">
                            <label className="text-xs text-graphite-400 block mb-1">Nivel de Actividad Física</label>
                            <select value={actividad} onChange={(e) => { const v = Number(e.target.value); setActividad(v); guardarPerfil({ actividad: v }); }}
                                className={`w-full ${INPUT} p-2.5 text-sm font-bold`}>
                                <option value={1.2}>Sedentario (poco o nada ejercicio)</option>
                                <option value={1.375}>Ligero (ejercicio 1-3 días/sem)</option>
                                <option value={1.55}>Moderado (ejercicio 3-5 días/sem)</option>
                                <option value={1.725}>Intenso (ejercicio 6-7 días/sem)</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-3 gap-2 mb-4">
                            {objBtn('definicion', 'Definición')}
                            {objBtn('mantenimiento', 'Mantenimiento')}
                            {objBtn('volumen', 'Volumen')}
                        </div>

                        <div className="p-4 bg-graphite-900 rounded-xl border border-graphite-700 text-center mb-4">
                            <span className="text-xs text-graphite-400 uppercase tracking-wider font-semibold">Meta Diaria Recomendada</span>
                            <p className="text-4xl font-black text-neon-500 mt-1">{caloriasMeta} <span className="text-sm font-normal text-graphite-400">kcal</span></p>
                        </div>

                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700"><span className="text-[10px] text-graphite-400">Proteínas</span><p className="text-sm font-bold text-neon-500">{proteinasMeta}g</p></div>
                            <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700"><span className="text-[10px] text-graphite-400">Carbohidratos</span><p className="text-sm font-bold text-white">{carbosMeta}g</p></div>
                            <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700"><span className="text-[10px] text-graphite-400">Grasas</span><p className="text-sm font-bold text-graphite-300">{grasasMeta}g</p></div>
                        </div>
                    </div>

                    {/* Registro */}
                    <div className={`${CARD} p-5 sm:p-6`}>
                        <div className="flex items-center space-x-3 mb-4">
                            <div className={ICON_BOX}><Icons.Utensils /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">Registro Nutricional</h2>
                                <p className="text-graphite-400 text-sm">Busca alimentos en la base de datos</p>
                            </div>
                        </div>

                        <input type="text" placeholder="Escribe un alimento (ej. Asado, Alfajor, Arroz...)" value={busqueda} onChange={(e) => buscarAlimentos(e.target.value)}
                            className={`w-full ${INPUT} px-4 py-3 mb-4`} />

                        {cargando && <p className="text-xs text-graphite-400 text-center py-2">Buscando en la base de datos...</p>}

                        {alimentos.length > 0 && (
                            <div className="max-h-[50vh] lg:max-h-96 overflow-y-auto space-y-3 mb-6 bg-graphite-900/80 p-2 rounded-xl border border-graphite-700">
                                {alimentos.map((item) => {
                                    const itemId = item.id || item.Id;
                                    const nom = item.nombre || item.Nombre;
                                    const cal = item.calorias !== undefined ? item.calorias : item.Calorias;
                                    const pro = item.proteinas !== undefined ? item.proteinas : item.Proteinas;
                                    const car = item.carbohidratos !== undefined ? item.carbohidratos : item.Carbohidratos;
                                    const gra = item.grasas !== undefined ? item.grasas : item.Grasas;
                                    const cant = cantidadesInputs[itemId] !== undefined ? cantidadesInputs[itemId] : 100;
                                    const unidad = tiposUnidad[itemId] || 'g';
                                    const calc = calcularFactorYDetalle(itemId, item);

                                    return (
                                        <div key={itemId} className="p-3 bg-graphite-800 rounded-xl border border-graphite-700 space-y-3">
                                            <div>
                                                <h4 className="text-white font-bold text-sm">{nom}</h4>
                                                <p className="text-[10px] text-graphite-400">Base 100g/ml: {cal} kcal | P: {pro}g | C: {car}g | G: {gra}g</p>
                                            </div>
                                            <div className="grid grid-cols-12 gap-2 items-center pt-2 border-t border-graphite-700/60">
                                                <div className="col-span-4">
                                                    <input type="number" inputMode="decimal" value={cant} onChange={(e) => handleCantidadChange(itemId, e.target.value)}
                                                        className="w-full bg-graphite-900 text-white font-bold text-center py-1.5 rounded-lg border border-graphite-600 focus:border-neon-500 outline-none text-sm" />
                                                </div>
                                                <div className="col-span-4">
                                                    <select value={unidad} onChange={(e) => handleUnidadChange(itemId, e.target.value)}
                                                        className="w-full bg-graphite-900 text-neon-500 font-bold text-xs py-2 px-1 rounded-lg border border-graphite-600 outline-none">
                                                        <option value="g">Gramos (g)</option>
                                                        <option value="vasos">Vasos</option>
                                                        <option value="cucharadas">Cucharadas</option>
                                                    </select>
                                                </div>
                                                <div className="col-span-4 text-right">
                                                    <span className="text-xs font-bold text-neon-500 block">{calc.calorias} kcal</span>
                                                    <button onClick={() => agregarAlConsumo(item)} className={`w-full mt-1 ${BTN_NEON} text-[11px] py-1.5 rounded-lg`}>+ Agregar</button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="mt-6 border-t border-graphite-700 pt-4">
                            <h3 className="text-white font-bold mb-3">Consumo de Hoy</h3>

                            <div className="mb-4">
                                <div className="flex justify-between text-xs mb-1.5">
                                    <span className="text-graphite-400">Calorías</span>
                                    <span className="font-bold text-neon-500">{Math.round(totalCalorias)} <span className="text-graphite-400 font-normal">/ {caloriasMeta} kcal</span></span>
                                </div>
                                <div className="h-2 bg-graphite-900 rounded-full overflow-hidden border border-graphite-700">
                                    <div className="h-full bg-neon-500 transition-all duration-500" style={{ width: `${progresoCal}%` }}></div>
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-2 mb-4">
                                <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700 text-center"><span className="text-[10px] text-graphite-400">Proteínas</span><p className="text-sm font-bold text-neon-500">{totalProteinas.toFixed(1)}g <span className="text-[10px] text-graphite-500 font-normal">/ {proteinasMeta}g</span></p></div>
                                <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700 text-center"><span className="text-[10px] text-graphite-400">Carbos</span><p className="text-sm font-bold text-white">{totalCarbos.toFixed(1)}g <span className="text-[10px] text-graphite-500 font-normal">/ {carbosMeta}g</span></p></div>
                                <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700 text-center"><span className="text-[10px] text-graphite-400">Grasas</span><p className="text-sm font-bold text-graphite-300">{totalGrasas.toFixed(1)}g <span className="text-[10px] text-graphite-500 font-normal">/ {grasasMeta}g</span></p></div>
                            </div>

                            <div className="space-y-2">
                                {alimentosConsumidos.length === 0 ? (
                                    <p className="text-xs text-graphite-500 text-center py-2">No has agregado alimentos hoy.</p>
                                ) : (
                                    alimentosConsumidos.map((c) => {
                                        const cId = c.id || c.Id;
                                        const cNom = c.nombre || c.Nombre;
                                        const cMed = c.medidatexto || c.MedidaTexto;
                                        return (
                                            <div key={cId} className="flex justify-between items-center gap-2 bg-graphite-900 p-3 rounded-xl text-xs border border-graphite-700/50">
                                                <div className="min-w-0">
                                                    <div className="flex items-center flex-wrap gap-x-2 gap-y-1">
                                                        <span className="text-white font-bold">{cNom}</span>
                                                        <span className="bg-neon-500/10 text-neon-500 px-2 py-0.5 rounded text-[10px] font-semibold">({cMed})</span>
                                                    </div>
                                                    <p className="text-[10px] text-graphite-400 mt-1">{pick(c, 'calorias', 'Calorias')} kcal | P: {pick(c, 'proteinas', 'Proteinas')}g | C: {pick(c, 'carbohidratos', 'Carbohidratos')}g | G: {pick(c, 'grasas', 'Grasas')}g</p>
                                                </div>
                                                <button onClick={() => eliminarDelConsumo(cId)} className="text-red-400 hover:text-red-300 p-2 bg-red-400/10 rounded-lg cursor-pointer shrink-0"><Icons.Trash2 /></button>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ====================================================
        // PROGRESO
        // ====================================================
        const ProgressTab = ({ usuario }) => {
            const [routines, setRoutines] = useState({});
            const [selectedDay, setSelectedDay] = useState(1);
            const [selectedExercise, setSelectedExercise] = useState('');
            const [historialData, setHistorialData] = useState([]);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                fetch(`/api/rutinas?usuarioId=${usuario.Id}`)
                    .then(res => res.json())
                    .then(data => {
                        const formatted = {};
                        data.forEach(item => {
                            const dia = item.diasemana || item.DiaSemana;
                            const nombreEj = item.nombreep || item.nombreejercicio || item.NombreEjercicio;
                            if (!formatted[dia]) formatted[dia] = [];
                            formatted[dia].push(nombreEj);
                        });
                        setRoutines(formatted);
                        if (formatted[1] && formatted[1].length > 0) setSelectedExercise(formatted[1][0]);
                    })
                    .catch(err => console.error("Error al cargar rutinas en progreso:", err));
            }, []);

            const handleDayChange = (day) => {
                setSelectedDay(day);
                const ejercicios = routines[day] || [];
                setSelectedExercise(ejercicios.length > 0 ? ejercicios[0] : '');
            };

            useEffect(() => {
                if (!selectedExercise) { setHistorialData([]); return; }
                fetch(`/api/historial-cargas?usuarioId=${usuario.Id}&ejercicio=${encodeURIComponent(selectedExercise)}`)
                    .then(res => res.json())
                    .then(data => setHistorialData(data))
                    .catch(err => console.error("Error al cargar historial:", err));
            }, [selectedExercise]);

            useEffect(() => {
                if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; }
                if (!chartRef.current) return;

                const labels = historialData.map(i => (i.fecha || i.Fecha).split('T')[0]);
                const pesos = historialData.map(i => i.pesomaximo !== undefined ? i.pesomaximo : i.PesoMaximo);

                chartInstance.current = new Chart(chartRef.current, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Peso Máximo del Día (kg)',
                            data: pesos,
                            borderColor: '#a3ff12',
                            backgroundColor: 'rgba(163, 255, 18, 0.15)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0,
                            pointBackgroundColor: '#a3ff12',
                            pointBorderColor: '#0e0f11',
                            pointRadius: 6,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: '#2b2f35' }, ticks: { color: '#8a9099' } },
                            y: { grid: { color: '#2b2f35' }, ticks: { color: '#8a9099' } }
                        }
                    }
                });
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [historialData]);

            const diasDisponibles = Object.keys(routines);
            const ejerciciosDelDia = routines[selectedDay] || [];

            return (
                <div className="space-y-6 pb-24 lg:pb-4">
                    <div className={`${CARD} p-5 sm:p-6`}>
                        <div className="flex items-center space-x-3 mb-4">
                            <div className={ICON_BOX}><Icons.TrendingUp /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">Evolución de Cargas</h2>
                                <p className="text-graphite-400 text-sm">Polígono de frecuencias por sesión de entrenamiento</p>
                            </div>
                        </div>

                        <div className="mb-4">
                            <label className="text-xs text-graphite-400 block mb-1">Seleccionar Día de Rutina</label>
                            <div className="flex flex-wrap gap-2">
                                {diasDisponibles.length === 0 ? (
                                    <p className="text-xs text-graphite-500">No hay rutinas creadas todavía.</p>
                                ) : (
                                    diasDisponibles.map(dia => (
                                        <button key={dia} onClick={() => handleDayChange(Number(dia))}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                                                selectedDay === Number(dia)
                                                    ? 'bg-neon-500 text-graphite-950 neon-glow'
                                                    : 'bg-graphite-900 text-graphite-400 border border-graphite-700 hover:border-graphite-500'
                                            }`}>
                                            Día {dia}
                                        </button>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="mb-6">
                            <label className="text-xs text-graphite-400 block mb-1">Seleccionar Ejercicio</label>
                            <select value={selectedExercise} onChange={(e) => setSelectedExercise(e.target.value)}
                                className={`w-full ${INPUT} p-3 text-sm font-bold`}>
                                {ejerciciosDelDia.length === 0 ? (
                                    <option value="">No hay ejercicios en este día</option>
                                ) : (
                                    ejerciciosDelDia.map((ejer, idx) => <option key={idx} value={ejer}>{ejer}</option>)
                                )}
                            </select>
                        </div>

                        <div className="bg-graphite-900 p-4 rounded-xl border border-graphite-700">
                            {!selectedExercise || historialData.length === 0 ? (
                                <p className="text-center text-graphite-500 py-10 text-xs">Entrená y anotá tus pesos en la rutina para ver tu polígono de frecuencias.</p>
                            ) : (
                                <div className="relative h-64 sm:h-80 lg:h-96"><canvas ref={chartRef}></canvas></div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ====================================================
        // APP
        // ====================================================
        const App = () => {
            const [usuario, setUsuario] = useState(() => {
                const saved = localStorage.getItem('fitpro_usuario');
                return saved ? JSON.parse(saved) : null;
            });
            const [pantallaAuth, setPantallaAuth] = useState('login');
            const [nombreInput, setNombreInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [activeTab, setActiveTab] = useState('training');

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre: nombreInput, password: passwordInput })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setUsuario(data.usuario);
                        localStorage.setItem('fitpro_usuario', JSON.stringify(data.usuario));
                    } else {
                        alert(data.error || 'Credenciales inválidas.');
                    }
                } catch (err) {
                    console.error("Error en login:", err);
                    alert("No se pudo conectar con el servidor.");
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre: nombreInput, password: passwordInput })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert('¡Registrado con éxito! Ahora inicia sesión.');
                        setPantallaAuth('login');
                        setNombreInput(''); setPasswordInput('');
                    } else {
                        alert(data.error || 'Error al registrarse.');
                    }
                } catch (err) {
                    console.error("Error en registro:", err);
                    alert("No se pudo conectar con el servidor.");
                }
            };

            const handleLogout = () => {
                setUsuario(null);
                localStorage.removeItem('fitpro_usuario');
            };

            if (!usuario) {
                const esLogin = pantallaAuth === 'login';
                return (
                    <div className="flex flex-col items-center justify-center min-h-[100dvh] bg-graphite-950 text-white p-4">
                        <div className="w-full max-w-sm bg-graphite-900 p-6 rounded-2xl border border-graphite-800 shadow-xl space-y-4">
                            <h1 className="text-3xl font-black text-neon-500 text-center tracking-tight">RUKO</h1>
                            <form onSubmit={esLogin ? handleLogin : handleRegister} className="space-y-3">
                                <input type="text" placeholder="Tu Nombre" value={nombreInput} onChange={e => setNombreInput(e.target.value)}
                                    className="w-full bg-graphite-800 p-3 rounded-lg border border-graphite-700 text-sm outline-none focus:border-neon-500" required />
                                <input type="password" placeholder="Contraseña" value={passwordInput} onChange={e => setPasswordInput(e.target.value)}
                                    className="w-full bg-graphite-800 p-3 rounded-lg border border-graphite-700 text-sm outline-none focus:border-neon-500" required />
                                <button type="submit" className={`w-full ${BTN_NEON} p-3 rounded-lg text-sm`}>{esLogin ? 'Iniciar Sesión' : 'Registrarse'}</button>
                                <p className="text-xs text-center text-graphite-400 cursor-pointer pt-2 hover:text-neon-500"
                                    onClick={() => { setPantallaAuth(esLogin ? 'registro' : 'login'); setNombreInput(''); setPasswordInput(''); }}>
                                    {esLogin ? '¿No tenés cuenta? Registrate acá' : '¿Ya tenés cuenta? Iniciá sesión'}
                                </p>
                            </form>
                        </div>
                    </div>
                );
            }

            const nombreUsuario = usuario.nombre || usuario.Nombre;
            const navItems = [
                { id: 'training', label: 'Rutina', Icon: Icons.Dumbbell },
                { id: 'nutrition', label: 'Nutrición', Icon: Icons.Apple },
                { id: 'progress', label: 'Progreso', Icon: Icons.TrendingUp },
            ];

            return (
                <div className="min-h-[100dvh] bg-graphite-950 font-sans">
                    {/* Sidebar (desktop) */}
                    <aside className="hidden lg:flex fixed inset-y-0 left-0 w-60 flex-col bg-graphite-900 border-r border-graphite-800 p-5 z-20">
                        <h1 className="text-2xl font-black text-neon-500 tracking-tight">RUKO</h1>
                        <nav className="mt-8 space-y-1">
                            {navItems.map(({ id, label, Icon }) => (
                                <button key={id} onClick={() => setActiveTab(id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-colors cursor-pointer ${
                                        activeTab === id ? 'bg-neon-500/10 text-neon-500' : 'text-graphite-400 hover:bg-graphite-800 hover:text-white'
                                    }`}>
                                    <Icon /><span>{label}</span>
                                </button>
                            ))}
                        </nav>
                    </aside>

                    <div className="lg:pl-60">
                        <header className="bg-graphite-900 safe-top pb-4 px-4 sm:px-6 shadow-md border-b border-graphite-800 sticky top-0 z-10">
                            <div className="max-w-5xl mx-auto flex justify-between items-center">
                                <h1 className="lg:invisible text-2xl font-black text-neon-500 tracking-tight">RUKO</h1>
                                <div className="flex items-center space-x-3">
                                    <span className="text-xs font-bold text-neon-500 truncate max-w-[40vw]">Hola, {nombreUsuario}</span>
                                    <button onClick={handleLogout} className={`text-[10px] px-2.5 py-1 rounded-lg ${BTN_DANGER}`}>Salir</button>
                                </div>
                            </div>
                        </header>

                        <main className="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
                            {activeTab === 'training' && <TrainingTab usuario={usuario} />}
                            {activeTab === 'nutrition' && <NutritionTab usuario={usuario} setUsuario={setUsuario} />}
                            {activeTab === 'progress' && <ProgressTab usuario={usuario} />}
                        </main>
                    </div>

                    {/* Barra inferior (móvil y tablet) */}
                    <nav className="lg:hidden fixed bottom-0 inset-x-0 bg-graphite-900/95 backdrop-blur-md border-t border-graphite-800 rounded-t-3xl z-20 safe-bottom">
                        <div className="flex justify-around items-center p-2 max-w-md mx-auto">
                            {navItems.map(({ id, label, Icon }) => (
                                <button key={id} onClick={() => setActiveTab(id)}
                                    className={`flex-1 flex flex-col items-center space-y-1 p-2 transition-colors cursor-pointer ${activeTab === id ? 'text-neon-500' : 'text-graphite-400'}`}>
                                    <Icon /><span className="text-[10px] font-medium">{label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) ReactDOM.createRoot(rootElement).render(<App />);
    </script>
</body>
</html>
