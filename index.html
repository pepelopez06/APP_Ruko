        html.light body { background-image: radial-gradient(700px 320px at 85% -6%, rgba(132, 204, 22, 0.18), transparent 70%); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes barUp { from { transform: scaleY(0.15); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
        @keyframes drift { to { transform: translate(18%, 14%); } }
        .fade-up { animation: fadeUp 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
        .stagger > * { animation: fadeUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
        .stagger > *:nth-child(2) { animation-delay: 0.05s; } .stagger > *:nth-child(3) { animation-delay: 0.1s; } .stagger > *:nth-child(4) { animation-delay: 0.15s; }
        .stagger > *:nth-child(5) { animation-delay: 0.2s; } .stagger > *:nth-child(6) { animation-delay: 0.25s; } .stagger > *:nth-child(7) { animation-delay: 0.3s; }
        .press { transition: transform 0.15s ease; } .press:active { transform: scale(0.97); }
        button:not(:disabled):active { transform: scale(0.97); }
        .glass-btn { width: 2.75rem; height: 2.75rem; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #fff; backdrop-filter: blur(10px); cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
        .glass-btn:hover { border-color: rgba(163,255,18,0.6); color: #a3ff12; }
        html.light .glass-btn { background: rgba(255,255,255,0.8); border-color: rgba(30,40,15,0.12); color: #14161a; }
        html.light .glass-btn:hover { color: #3f7d0a; border-color: #84cc16; }
        .hero { position: relative; background: linear-gradient(135deg, #d4ff4d 0%, #a3ff12 48%, #6fd400 100%); }
        .hero::before { content: ""; position: absolute; inset: -40%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), transparent 40%); animation: drift 8s ease-in-out infinite alternate; pointer-events: none; }
        .hero > * { position: relative; }
        @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

            const [cfg0] = useState(() => readCfgCache(usuario.Id) || {});
            const [hechos, setHechos] = useState(cfg0.hechos || {});
            const [heroOpen, setHeroOpen] = useState(false);
            const [trainingDays, setTrainingDays] = useState(() => { const v = Number(cfg0.diasEntrenamiento || localStorage.getItem('ruko_training_days')); return v >= 1 && v <= 7 ? v : 4; });
            const [inDay, setInDay] = useState(false);
            const [isConfigOpen, setIsConfigOpen] = useState(false);
            const [currentDay, setCurrentDay] = useState(Number(cfg0.diaActual) || 1);
            const [routines, setRoutines] = useState({});
            const [nombresDias, setNombresDias] = useState(() => {
                if (cfg0.nombresDias) return cfg0.nombresDias;
                const saved = localStorage.getItem('ruko_nombres_dias');
                return saved ? JSON.parse(saved) : { 1: "Pecho", 2: "Espalda", 3: "Piernas", 4: "Hombros" };
            });
            const [isAddingDB, setIsAddingDB] = useState(false);
            const [selectedMuscleGroup, setSelectedMuscleGroup] = useState("Pecho");
            const [busquedaEjercicio, setBusquedaEjercicio] = useState('');
            const [attendance, setAttendance] = useState(() => {
                const saved = localStorage.getItem(`ruko_asistencia_${usuario.Id}`);
                return saved ? JSON.parse(saved) : {};
            });

            const cargarDatos = () => {
                fetch(`/api/rutinas?usuarioId=${usuario.Id}`)
                    .then(res => res.json())
                    .then(data => {
                        const formatted = {};
                        (Array.isArray(data) ? data : []).forEach(item => {
                            const dia = item.diasemana || item.DiaSemana;
                            const idReg = item.id || item.Id;
                            const nombreEj = item.nombreep || item.nombreejercicio || item.NombreEjercicio;
                            const setsJ = item.setsjson || item.SetsJson;
                            if (!formatted[dia]) formatted[dia] = [];
                            formatted[dia].push({
                                dbId: idReg,
                                id: idReg,
                                name: nombreEj,
                                expanded: false,
                                sets: typeof setsJ === 'string' ? JSON.parse(setsJ) : (setsJ || [])
                            });
                        });
                        setRoutines(formatted);
                    })
                    .catch(err => console.error("Error al cargar rutinas:", err));

                fetch(`/api/asistencia?usuarioId=${usuario.Id}`)
                    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                    .then(data => {
                        const lsKey = `ruko_asistencia_${usuario.Id}`;
                        let local = {};
                        try { local = JSON.parse(localStorage.getItem(lsKey) || '{}'); } catch (e) {}
                        const serverMap = {};
                        (Array.isArray(data) ? data : []).forEach(item => {
                            const fechaVal = item.fecha || item.Fecha;
                            if (fechaVal) serverMap[String(fechaVal).split('T')[0]] = true;
                        });
                        // Una sola vez: sube al servidor los días que solo existían en este navegador
                        const migKey = lsKey + '_sync';
                        if (!localStorage.getItem(migKey)) {
                            Object.keys(local).filter(k => local[k] && !serverMap[k]).forEach(k => {
                                serverMap[k] = true;
                                fetch('/api/asistencia', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ usuarioId: usuario.Id, fecha: k, asistio: true })
                                }).catch(err => console.error(err));
                            });
                            localStorage.setItem(migKey, '1');
                        }
                        setAttendance(serverMap);
                        localStorage.setItem(lsKey, JSON.stringify(serverMap));
                    })
                    .catch(err => console.error("Error al cargar asistencia:", err));
            };

            useEffect(() => { cargarDatos(); }, []);

            const activeRoutine = routines[currentDay] || [];

            const registrarHistorialAutomatico = (nombreEjercicio, sets) => {
                const maxPeso = Math.max(...sets.map(s => Number(s.weight) || 0));
                if (maxPeso <= 0) return;
                const now = new Date();
                const fechaHoy = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                fetch('/api/historial-cargas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuarioId: usuario.Id, fecha: fechaHoy, ejercicio: nombreEjercicio, pesoMaximo: maxPeso })
                }).catch(err => console.error("Error al registrar historial automático:", err));
            };

            const toggleExpand = (exId) => {
                setRoutines(prev => ({
                    ...prev,
                    [currentDay]: (prev[currentDay] || []).map(ex => ex.id === exId ? { ...ex, expanded: !ex.expanded } : ex)
                }));
            };

            // Aplica un cambio de series: actualiza estado, guarda en BD y registra historial
            const mutateSets = (exId, buildSets, trackHistory = true) => {
                setRoutines(prev => {
                    const list = (prev[currentDay] || []).map(ex => {
                        if (ex.id !== exId) return ex;
                        const newSets = buildSets(ex.sets);
                        fetch(`/api/rutinas/${ex.dbId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ setsJson: JSON.stringify(newSets) })
                        }).catch(err => console.error("Error al actualizar sets:", err));
                        if (trackHistory) registrarHistorialAutomatico(ex.name, newSets);
                        return { ...ex, sets: newSets };
                    });
                    return { ...prev, [currentDay]: list };
                });
            };

            const addSet = (exId) => mutateSets(exId, sets => [...sets, { ...(sets[sets.length - 1] || { reps: 10, weight: 0 }) }]);
            const removeSet = (exId, idx) => mutateSets(exId, sets => sets.filter((_, i) => i !== idx));
            const updateSet = (exId, idx, field, value) =>
                mutateSets(exId, sets => sets.map((s, i) => i === idx ? { ...s, [field]: value === '' ? '' : Number(value) } : s), field === 'weight');

            const agregarEjercicioDirecto = (exerciseName) => {
                fetch('/api/rutinas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuario.Id,
                        diaSemana: currentDay,
                        ejercicio: exerciseName,
                        setsJson: JSON.stringify([{ reps: 10, weight: 0 }])
                    })
                })
                    .then(res => res.json())
                    .then(() => { setIsAddingDB(false); setBusquedaEjercicio(''); cargarDatos(); })
                    .catch(err => console.error("Error al guardar ejercicio:", err));
            };

            const removeExercise = (dbId) => {
                fetch(`/api/rutinas/${dbId}`, { method: 'DELETE' })
                    .then(() => {
                        setRoutines(prev => ({
                            ...prev,
                            [currentDay]: (prev[currentDay] || []).filter(ex => ex.dbId !== dbId)
                        }));
                    })
                    .catch(err => console.error("Error al eliminar ejercicio:", err));
            };

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const monthNames = Array.from({ length: 12 }, (_, i) => { const m = new Date(2020, i, 1).toLocaleString(LOCALES[lang], { month: 'long' }); return m.charAt(0).toUpperCase() + m.slice(1); });

            const toggleAttendanceDay = (dayNum) => {
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                const nuevoEstado = !attendance[dateKey];
                const nuevo = { ...attendance, [dateKey]: nuevoEstado };
                setAttendance(nuevo);
                localStorage.setItem(`ruko_asistencia_${usuario.Id}`, JSON.stringify(nuevo));
                fetch('/api/asistencia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuarioId: usuario.Id, fecha: dateKey, asistio: nuevoEstado })
                }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
                  .catch(err => {
                      console.error("Error al actualizar asistencia:", err);
                      const rev = { ...nuevo, [dateKey]: !nuevoEstado };
                      setAttendance(rev);
                      localStorage.setItem(`ruko_asistencia_${usuario.Id}`, JSON.stringify(rev));
                      alert(t('saveErr'));
                  });
            };

            let listaFiltrada = [];
            if (busquedaEjercicio.trim() !== '') {
                Object.entries(exerciseDatabase).forEach(([muscle, lista]) => {
                    lista.filter(ex => ex.toLowerCase().includes(busquedaEjercicio.toLowerCase()))
                        .forEach(ex => listaFiltrada.push({ muscle, ex }));
                });
            } else if (selectedMuscleGroup && exerciseDatabase[selectedMuscleGroup]) {
                exerciseDatabase[selectedMuscleGroup].forEach(ex => listaFiltrada.push({ muscle: selectedMuscleGroup, ex }));
            }

            const dbRef = useRef(null);
            const cfgRef = useRef(cfg0);
            const cfgTimer = useRef(null);
            const pushCfg = (partial) => {
                cfgRef.current = { ...cfgRef.current, ...partial };
                localStorage.setItem(CFG_KEY(usuario.Id), JSON.stringify(cfgRef.current));
                clearTimeout(cfgTimer.current);
                cfgTimer.current = setTimeout(() => {
                    fetch(`/api/usuario/${usuario.Id}/config`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ config: cfgRef.current })
                    }).catch(err => console.error("Error al guardar configuración:", err));
                }, 500);
            };
            // Al abrir: el servidor manda; lo que solo estaba en este dispositivo se sube una vez
            useEffect(() => {
                fetch(`/api/usuario/${usuario.Id}/config`)
                    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(d => {
                        const srv = (d && d.config) || {};
                        const merged = { nombresDias, diasEntrenamiento: trainingDays, diaActual: currentDay, hechos, ...srv };
                        const nDias = Number(merged.diasEntrenamiento) || 4;
                        setNombresDias(merged.nombresDias);
                        setTrainingDays(nDias);
                        setCurrentDay(Math.min(Number(merged.diaActual) || 1, nDias));
                        setHechos(merged.hechos || {});
                        localStorage.setItem('ruko_nombres_dias', JSON.stringify(merged.nombresDias));
                        localStorage.setItem('ruko_training_days', String(nDias));
                        if (JSON.stringify(merged) !== JSON.stringify(srv)) pushCfg(merged);
                        else { cfgRef.current = merged; localStorage.setItem(CFG_KEY(usuario.Id), JSON.stringify(merged)); }
                    })
                    .catch(err => console.error("Error al cargar configuración:", err));
            }, []);
            const setDayName = (day, value) => {
                const nuevos = { ...nombresDias, [day]: value };
                setNombresDias(nuevos);
                localStorage.setItem('ruko_nombres_dias', JSON.stringify(nuevos));
                pushCfg({ nombresDias: nuevos });
            };
            const dayLabel = (d) => ((nombresDias[d] || '').trim() || `${t('day')} ${d}`);
            const changeDays = (n) => {
                setTrainingDays(n);
                localStorage.setItem('ruko_training_days', String(n));
                const nuevoDia = currentDay > n ? 1 : currentDay;
                if (currentDay > n) setCurrentDay(1);
                pushCfg({ diasEntrenamiento: n, diaActual: nuevoDia });
            };
            const addDay = () => { if (trainingDays < 7) changeDays(trainingDays + 1); };
            // Entrar/salir de un día (el botón "atrás" del celular también vuelve a los módulos)
            useEffect(() => {
                const onPop = () => { setInDay(false); setIsAddingDB(false); };
                window.addEventListener('popstate', onPop);
                return () => window.removeEventListener('popstate', onPop);
            }, []);
            const enterDay = (day) => {
                setCurrentDay(day);
                pushCfg({ diaActual: day });
                setInDay(true);
                setIsAddingDB(false);
                window.scrollTo({ top: 0 });
                try { history.pushState({ ruko: 'day' }, ''); } catch (e) {}
            };
            const leaveDay = () => {
                if (history.state && history.state.ruko === 'day') history.back();
                else { setInDay(false); setIsAddingDB(false); }
            };
            const openDB = () => {
                setIsAddingDB(true);
                setTimeout(() => { if (dbRef.current) dbRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
            };
            // Progreso semanal: días asistidos esta semana (lun-dom) vs. días configurados
            const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
            let weekDone = 0;
            for (let i = 0; i < 7; i++) {
                const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
                const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                if (attendance[k]) weekDone++;
            }
            const weekPct = Math.min(100, Math.round((weekDone / Math.max(1, trainingDays)) * 100));
            const BARS = 20;
            const hoyKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const hechosHoy = hechos[hoyKey] || {};
            const doneCount = activeRoutine.filter(ex => hechosHoy[ex.dbId]).length;
            const pctDia = activeRoutine.length ? Math.round((doneCount / activeRoutine.length) * 100) : 0;
            const filledBars = Math.round((weekPct / 100) * BARS);
            const dayComplete = activeRoutine.length > 0 && doneCount === activeRoutine.length;
            // Al completar el día, el peso de cada ejercicio se carga en Progreso (aunque no haya cambiado)
            useEffect(() => {
                const flag = `ruko_hist_${usuario.Id}_${hoyKey}_${currentDay}`;
                if (!dayComplete) { localStorage.removeItem(flag); return; }
                if (localStorage.getItem(flag)) return;
                activeRoutine.forEach(ex => registrarHistorialAutomatico(ex.name, ex.sets));
                localStorage.setItem(flag, '1');
            }, [dayComplete, currentDay]);
            const toggleDone = (dbId) => {
                const cur = { ...(hechos[hoyKey] || {}) };
                if (cur[dbId]) delete cur[dbId]; else cur[dbId] = true;
                const nuevo = { ...hechos, [hoyKey]: cur };
                const pruned = {};
                Object.keys(nuevo).sort().slice(-14).forEach(k => { pruned[k] = nuevo[k]; });
                setHechos(pruned);
                pushCfg({ hechos: pruned });
                // Si completaste todos los ejercicios del día, se marca la asistencia de hoy
                if (cur[dbId] && activeRoutine.length > 0 && activeRoutine.every(ex => cur[ex.dbId]) && !attendance[hoyKey]) toggleAttendanceDay(now.getDate());
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start pb-24 lg:pb-4">
                    {!inDay && (<>
                    {/* Título + botones de vidrio */}
                    <div className="lg:col-span-2 flex items-center justify-between fade-up">
                        <h2 className="text-4xl sm:text-5xl font-black tracking-tight text-white">{t('navTraining')}</h2>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setIsConfigOpen(!isConfigOpen)} className={`glass-btn ${isConfigOpen ? '!border-neon-500 !text-neon-500' : ''}`}><Icons.Sliders /></button>
                            
                        </div>
                    </div>

                    {isConfigOpen && (
                        <div className={`lg:col-span-2 ${CARD} p-4 fade-up`}>
                            <div className="flex items-center space-x-3">
                                <label className="text-sm font-medium text-graphite-300 w-full">{t('askDays')}</label>
                                <select
                                    value={trainingDays}
                                    onChange={(e) => changeDays(Number(e.target.value))}
                                    className="bg-graphite-900 text-white p-2 rounded-lg outline-none border border-graphite-600 focus:border-neon-500 font-bold"
                                >
                                    {[1, 2, 3, 4, 5, 6, 7].map(n => <option key={n} value={n}>{n} {t('days')}</option>)}
                                </select>
                            </div>
                        </div>
                    )}

                    {/* Tarjeta destacada: HOY */}
                    <div className="hero rounded-3xl p-5 text-ink neon-glow overflow-hidden fade-up">
                        <div className="flex justify-between items-start">
                            <span className="text-sm font-bold flex items-center gap-1.5">{t('today')} <span>✦</span></span>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setHeroOpen(!heroOpen)} className="w-10 h-10 rounded-full bg-ink/15 hover:bg-ink/25 flex items-center justify-center cursor-pointer transition-colors">
                                    <span className={`transition-transform duration-300 ${heroOpen ? 'rotate-180' : ''}`}><Icons.ChevronDown /></span>
                                </button>
                                <button onClick={() => enterDay(currentDay)} className="w-10 h-10 rounded-full bg-ink/15 hover:bg-ink/25 flex items-center justify-center cursor-pointer transition-colors"><Icons.ArrowUpRight /></button>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 items-end mt-6">
                            <div className="min-w-0">
                                <p className="text-3xl font-black leading-[1.05] break-words">{nombresDias[currentDay] || t('noName')}</p>
                                <p className="text-xs font-semibold opacity-70 mt-2">{t('day')} {currentDay} · {activeRoutine.length} {t('exercises')}</p>
                            </div>
                            <div>
                                <div className="flex items-end gap-[3px] h-14">
                                    {Array.from({ length: BARS }, (_, i) => (
                                        <span key={i} className="flex-1 rounded-full origin-bottom transition-all duration-500"
                                            style={{ height: i < filledBars ? '100%' : '42%', background: i < filledBars ? '#0e0f11' : 'rgba(14,15,17,0.25)', animation: 'barUp 0.6s cubic-bezier(0.2,0.8,0.2,1) backwards', animationDelay: `${i * 30}ms` }}></span>
                                    ))}
                                </div>
                                <div className="flex justify-between gap-2 text-[11px] font-bold mt-2">
                                    <span>{weekPct}%</span>
                                    <span className="text-right">{weekDone}/{trainingDays} · {t('thisWeek')}</span>
                                </div>
                            </div>
                        </div>
                        {heroOpen && (
                            <div className="mt-4 rounded-2xl bg-ink/10 p-3 space-y-3 fade-up">
                                <div className="flex flex-wrap gap-2">
                                    {Array.from({ length: trainingDays }, (_, i) => i + 1).map(d => (
                                        <button key={d} onClick={() => { setCurrentDay(d); pushCfg({ diaActual: d }); }}
                                            className={`px-3 py-1.5 rounded-full text-xs font-bold cursor-pointer transition-colors ${currentDay === d ? 'bg-ink text-neon-400' : 'bg-ink/10 hover:bg-ink/20'}`}>
                                            {dayLabel(d)}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Calendario de asistencia */}
                    <div className={`${CARD} p-5`}>
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center space-x-2">
                                <div className="text-neon-500 bg-neon-500/10 p-2 rounded-lg"><Icons.Calendar /></div>
                                <h3 className="font-bold text-white text-sm">{t('attendance')}: {monthNames[month]} {year}</h3>
                            </div>
                            <span className="text-xs text-graphite-400 hidden sm:block">{t('tapToMark')}</span>
                        </div>
                        <div className="grid grid-cols-7 gap-1.5 text-center">
                            {t('wd').map((d, i) => <span key={i} className="text-[10px] font-bold text-graphite-500 mb-1">{d}</span>)}
                            {Array.from({ length: firstDayIndex }, (_, i) => <div key={`empty-${i}`} />)}
                            {Array.from({ length: daysInMonth }, (_, i) => i + 1).map(dayNum => {
                                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                                const isChecked = !!attendance[dateKey];
                                return (
                                    <button
                                        key={dayNum}
                                        type="button"
                                        onClick={() => toggleAttendanceDay(dayNum)}
                                        className={`${dayNum === now.getDate() ? 'ring-2 ring-neon-500/60' : ''} press h-9 sm:h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all border cursor-pointer ${
                                            isChecked
                                                ? 'bg-neon-500 text-ink border-neon-400 neon-glow'
                                                : 'bg-graphite-900 text-graphite-400 border-graphite-700 hover:border-graphite-500'
                                        }`}
                                    >
                                        <span>{dayNum}</span>
                                        {isChecked && <span className="scale-75 -mt-0.5"><Icons.Check /></span>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Días como módulos */}
                    <div className="lg:col-span-2">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-graphite-400 mb-3">{t('yourDays')}</h3>
                        <div className="stagger grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                            {Array.from({ length: trainingDays }, (_, i) => i + 1).map(day => {
                                const sel = currentDay === day;
                                const list = routines[day] || [];
                                return (
                                    <div key={day} onClick={() => enterDay(day)} role="button"
                                        className={`press relative overflow-hidden rounded-3xl border p-4 min-h-[190px] flex flex-col justify-between cursor-pointer transition-all duration-300 ${
                                            sel ? 'border-neon-500/70 bg-gradient-to-br from-neon-500/15 to-transparent neon-glow' : 'bg-graphite-800 border-graphite-700 hover:border-graphite-500'
                                        }`}>
                                        <div className="flex justify-between items-start">
                                            <span className={`text-4xl font-black tabular-nums leading-none ${sel ? 'text-neon-500' : 'text-graphite-600'}`}>{String(day).padStart(2, '0')}</span>
                                            <span className={`w-9 h-9 rounded-full flex items-center justify-center ${sel ? 'bg-neon-500 text-ink' : 'bg-graphite-700 text-graphite-300'}`}><Icons.ArrowUpRight /></span>
                                        </div>
                                        <div className="min-w-0">
                                            <p className="text-xl font-black leading-tight text-white break-words">{nombresDias[day] || t('noName')}</p>
                                            <div className="mt-2 space-y-0.5">
                                                {list.slice(0, 2).map(ex => <p key={ex.dbId} className="text-[11px] text-graphite-400 truncate">{ex.name}</p>)}
                                                {list.length > 2 && <p className="text-[11px] text-graphite-500">+{list.length - 2}</p>}
                                            </div>
                                            {list.length > 0 && list.every(ex => hechosHoy[ex.dbId])
                                                ? <span className="inline-flex items-center gap-1 mt-2 text-[11px] font-bold px-2.5 py-1 rounded-full bg-neon-500 text-ink"><Icons.Check /> {t('completed')}</span>
                                                : <span className="inline-block mt-2 text-[11px] font-bold px-2.5 py-1 rounded-full bg-graphite-900 border border-graphite-700 text-graphite-300">{list.length} {t('exercises')}</span>}
                                        </div>
                                    </div>
                                );
                            })}
                            {trainingDays < 7 && (
                                <div onClick={addDay} role="button"
                                    className="press rounded-3xl border-2 border-dashed border-graphite-600 hover:border-neon-500 text-graphite-400 hover:text-neon-500 min-h-[190px] flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors">
                                    <Icons.Plus /><span className="text-xs font-bold">{t('newDay')}</span>
                                </div>
                            )}
                        </div>
                    </div>
                    </>)}

                    {/* Vista interna del día */}
                    {inDay && (<>
                    <div className="lg:col-span-2 flex items-center gap-3 fade-up">
                        <button onClick={leaveDay} className="glass-btn"><Icons.ChevronLeft /></button>
                        <div className="min-w-0 flex-1">
                            <p className="text-[11px] uppercase font-bold tracking-wider text-graphite-400">{t('day')} {currentDay} · {activeRoutine.length} {t('exercises')}</p>
                            <input
                                type="text"
                                value={nombresDias[currentDay] || ''}
                                onChange={(e) => setDayName(currentDay, e.target.value)}
                                placeholder={t('namePh')}
                                className="w-full bg-transparent text-white font-black text-3xl sm:text-4xl outline-none placeholder-graphite-500 border-b border-transparent focus:border-neon-500"
                            />
                        </div>
                        <button onClick={openDB} className="glass-btn"><Icons.Plus /></button>
                    </div>
                    {dayComplete && (
                        <div className="lg:col-span-2 flex items-center gap-3 rounded-2xl bg-neon-500 text-ink px-4 py-3 neon-glow fade-up">
                            <span className="w-8 h-8 rounded-full bg-ink text-neon-400 flex items-center justify-center shrink-0"><Icons.Check /></span>
                            <div className="min-w-0">
                                <p className="font-black leading-tight">{t('dayDone')}</p>
                                {attendance[hoyKey] && <p className="text-xs font-semibold opacity-70">{t('attendanceMarked')}</p>}
                            </div>
                        </div>
                    )}

                    {/* Ejercicios */}
                    <div className="space-y-4 lg:col-span-2 lg:grid lg:grid-cols-2 lg:gap-4 lg:space-y-0 lg:items-start">
                        {activeRoutine.length === 0 ? (
                            <div className="lg:col-span-2 text-center py-10 bg-graphite-800 rounded-2xl border border-graphite-700 border-dashed">
                                <p className="text-graphite-400 text-sm">{t('noEx')}</p>
                            </div>
                        ) : (
                            activeRoutine.map(exercise => (
                                <div key={exercise.dbId} className={`${CARD} overflow-hidden`}>
                                    <div className="p-4 flex justify-between items-center gap-3 cursor-pointer hover:bg-graphite-700/30 transition-colors" onClick={() => toggleExpand(exercise.id)}>
                                        <div className="flex items-center gap-3 min-w-0">
                                            <button onClick={(e) => { e.stopPropagation(); toggleDone(exercise.dbId); }}
                                                className={`w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors cursor-pointer ${hechosHoy[exercise.dbId] ? 'bg-neon-500 border-neon-500 text-ink' : 'border-graphite-500 text-transparent hover:border-neon-500'}`}><Icons.Check /></button>
                                            <h3 className={`font-bold text-base min-w-0 ${hechosHoy[exercise.dbId] ? 'text-graphite-400 line-through' : 'text-white'}`}>{exercise.name}</h3>
                                        </div>
                                        <div className="flex items-center space-x-3 shrink-0">
                                            <span className="text-xs bg-graphite-700 text-neon-500 px-2 py-1 rounded-full font-medium whitespace-nowrap">{exercise.sets.length} {t('sets')}</span>
                                            <div className={`transform transition-transform ${exercise.expanded ? 'rotate-180' : ''} text-graphite-400`}><Icons.ChevronDown /></div>
                                        </div>
                                    </div>

                                    {exercise.expanded && (
                                        <div className="p-4 bg-graphite-900/50 border-t border-graphite-700">
                                            <div className="grid grid-cols-12 gap-2 mb-2 text-xs font-semibold text-graphite-400 text-center px-1">
                                                <div className="col-span-2">{t('setCap')}</div>
                                                <div className="col-span-4">KG</div>
                                                <div className="col-span-4">REPS</div>
                                                <div className="col-span-2"></div>
                                            </div>
                                            {exercise.sets.map((set, idx) => (
                                                <div key={`set-${idx}`} className="grid grid-cols-12 gap-2 items-center mb-3">
                                                    <div className="col-span-2 text-center text-graphite-500 font-bold bg-graphite-800 py-2 rounded-lg text-sm">{idx + 1}</div>
                                                    <div className="col-span-4">
                                                        <input type="number" inputMode="decimal" value={set.weight} onChange={(e) => updateSet(exercise.id, idx, 'weight', e.target.value)}
                                                            className="w-full bg-graphite-800 text-white text-center py-2 rounded-lg outline-none focus:ring-2 focus:ring-neon-500 border border-graphite-700 font-bold" />
                                                    </div>
                                                    <div className="col-span-4">
                                                        <input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(exercise.id, idx, 'reps', e.target.value)}
                                                            className="w-full bg-graphite-800 text-white text-center py-2 rounded-lg outline-none focus:ring-2 focus:ring-neon-500 border border-graphite-700 font-bold" />
                                                    </div>
                                                    <div className="col-span-2 flex justify-center">
                                                        <button onClick={() => removeSet(exercise.id, idx)} className="text-red-400 hover:text-red-300 p-2 bg-red-400/10 rounded-lg cursor-pointer"><Icons.Trash2 /></button>
                                                    </div>
                                                </div>
                                            ))}
                                            <div className="flex space-x-2 mt-4">
                                                <button onClick={() => addSet(exercise.id)} className="flex-1 py-2 rounded-xl text-sm font-bold bg-graphite-700 text-white hover:bg-graphite-600 transition-colors cursor-pointer">{t('addSet')}</button>
                                                <button onClick={() => removeExercise(exercise.dbId)} className={`py-2 px-4 rounded-xl text-sm font-bold ${BTN_DANGER}`}>{t('del')}</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))
                        )}
                    </div>

                    <button
                        onClick={openDB}
                        className={`lg:col-span-2 w-full ${BTN_NEON} py-4 rounded-2xl neon-glow flex justify-center items-center space-x-2 mt-2`}
                    >
                        <Icons.Plus />
                        <span>{t('explore')}</span>
                    </button>

                    {isAddingDB && (
                        <div ref={dbRef} className={`lg:col-span-2 ${CARD} p-5 space-y-4`}>
                            <h3 className="text-white font-bold flex items-center justify-between">
                                <span className="flex items-center text-neon-500"><Icons.Dumbbell /> <span className="ml-2 text-white">{t('pickMuscle')}</span></span>
                                <button onClick={() => setIsAddingDB(false)} className="text-xs text-graphite-400 hover:text-white cursor-pointer">{t('close')}</button>
                            </h3>
                            <input type="text" placeholder={t('searchEx')} value={busquedaEjercicio} onChange={(e) => setBusquedaEjercicio(e.target.value)}
                                className={`w-full ${INPUT} px-4 py-2.5 text-sm`} />
                            {!busquedaEjercicio && (
                                <div className="flex flex-wrap gap-2">
                                    {Object.keys(exerciseDatabase).map(muscle => (
                                        <button key={muscle} onClick={() => setSelectedMuscleGroup(muscle)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer ${
                                                selectedMuscleGroup === muscle ? 'bg-neon-500 text-ink' : 'bg-graphite-700 text-graphite-300 hover:bg-graphite-600'
                                            }`}>
                                            {muscle}
                                        </button>
                                    ))}
                                </div>
                            )}
                            <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-2 hide-scrollbar lg:grid lg:grid-cols-2 lg:gap-2 lg:space-y-0">
                                {listaFiltrada.length === 0 ? (
                                    <p className="text-xs text-graphite-400 text-center py-4 lg:col-span-2">{t('noResults')}</p>
                                ) : (
                                    listaFiltrada.map((item, idx) => (
                                        <div key={idx} onClick={() => agregarEjercicioDirecto(item.ex)}
                                            className="w-full text-left p-3 rounded-xl bg-graphite-900 border border-graphite-700 hover:border-neon-500 text-sm text-white font-medium flex justify-between items-center gap-3 transition-colors cursor-pointer">
                                            <div className="min-w-0">
                                                <span>{item.ex}</span>
                                                <span className="block text-[10px] text-neon-500">{item.muscle}</span>
                                            </div>
                                            <span className="bg-neon-500/15 text-neon-500 p-2 rounded-lg shrink-0"><Icons.Plus /></span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                    </>)}
                </div>
            );
        };

        // ====================================================
        // NUTRICIÓN
        // ====================================================
        const NutritionTab = ({ usuario, setUsuario }) => {
            const { t } = useT();
            const [peso, setPeso] = useState(usuario.Peso || 75);
            const [altura, setAltura] = useState(usuario.Altura || 175);
            const [edad, setEdad] = useState(usuario.Edad || 20);
            const [actividad, setActividad] = useState(usuario.Actividad || 1.55);
            const [objetivo, setObjetivo] = useState(usuario.Objetivo || 'mantenimiento');

            const [busqueda, setBusqueda] = useState('');
            const [alimentos, setAlimentos] = useState([]);
            const [cargando, setCargando] = useState(false);
            const [flashAdded, setFlashAdded] = useState('');
            const [cantidadesInputs, setCantidadesInputs] = useState({});
            const [tiposUnidad, setTiposUnidad] = useState({});
            const [alimentosConsumidos, setAlimentosConsumidos] = useState([]);

            const now = new Date();
            const fechaHoy = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            const cargarConsumo = () => {
                fetch(`/api/consumo?usuarioId=${usuario.Id}&fecha=${fechaHoy}`)
                    .then(res => res.json())
                    .then(data => setAlimentosConsumidos(Array.isArray(data) ? data : []))
                    .catch(err => console.error("Error al cargar consumo:", err));
            };

            useEffect(() => { cargarConsumo(); }, []);

            const guardarPerfil = (nv = {}) => {
                const p = nv.peso !== undefined ? nv.peso : peso;
                const a = nv.altura !== undefined ? nv.altura : altura;
                const e = nv.edad !== undefined ? nv.edad : edad;
                const act = nv.actividad !== undefined ? nv.actividad : actividad;
                const obj = nv.objetivo !== undefined ? nv.objetivo : objetivo;

                const actualizado = { ...usuario, Peso: p, Altura: a, Edad: e, Actividad: act, Objetivo: obj };
                localStorage.setItem('fitpro_usuario', JSON.stringify(actualizado));
                if (setUsuario) setUsuario(actualizado);

                fetch(`/api/usuario/${usuario.Id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peso: p, altura: a, edad: e, actividad: act, objetivo: obj })
                }).catch(err => console.error("Error al actualizar perfil:", err));
            };

            const tmb = (10 * peso) + (6.25 * altura) - (5 * edad) + 5;
            const mantenimiento = Math.round(tmb * actividad);
            const caloriasMeta = objetivo === 'volumen' ? mantenimiento + 300 : objetivo === 'definicion' ? mantenimiento - 400 : mantenimiento;
            const proteinasMeta = Math.round(peso * 2.0);
            const grasasMeta = Math.round((caloriasMeta * 0.25) / 9);
            const carbosMeta = Math.round((caloriasMeta - (proteinasMeta * 4) - (grasasMeta * 9)) / 4);

            const buscarAlimentos = (termino) => {
                setBusqueda(termino);
                if (termino.trim() === '') { setAlimentos([]); return; }
                setCargando(true);
                fetch(`/api/alimentos?buscar=${encodeURIComponent(termino)}`)
                    .then(res => res.json())
                    .then(data => {
                        setAlimentos(Array.isArray(data) ? data : []);
                        const ic = {}, iu = {};
                        (Array.isArray(data) ? data : []).forEach(item => { const id = item.id || item.Id; ic[id] = 100; iu[id] = 'g'; });
                        setCantidadesInputs(ic);
                        setTiposUnidad(iu);
                        setCargando(false);
                    })
                    .catch(err => { console.error("Error al buscar alimentos:", err); setCargando(false); });
            };

            const handleCantidadChange = (id, v) => setCantidadesInputs({ ...cantidadesInputs, [id]: v === '' ? '' : Number(v) });
            const handleUnidadChange = (id, u) => setTiposUnidad({ ...tiposUnidad, [id]: u });

            const calcularFactorYDetalle = (id, item) => {
                const cant = Number(cantidadesInputs[id]) || 0;
                const unidad = tiposUnidad[id] || 'g';
                let gramos = cant;
                let texto = `${cant}g`;
                if (unidad === 'vasos') {
                    gramos = cant * 250;
                    texto = `${cant} vaso${cant !== 1 ? 's' : ''} (${gramos} ml)`;
                } else if (unidad === 'cucharadas') {
                    gramos = cant * 15;
                    texto = `${cant} cda${cant !== 1 ? 's' : ''} (${gramos} ml)`;
                }
                const factor = gramos / 100;
                const cal = item.calorias !== undefined ? item.calorias : item.Calorias;
                const pro = item.proteinas !== undefined ? item.proteinas : item.Proteinas;
                const car = item.carbohidratos !== undefined ? item.carbohidratos : item.Carbohidratos;
                const gra = item.grasas !== undefined ? item.grasas : item.Grasas;
                return {
                    factor,
                    textoMedida: texto,
                    calorias: Math.round(cal * factor),
                    proteinas: Number((pro * factor).toFixed(1)),
                    carbohidratos: Number((car * factor).toFixed(1)),
                    grasas: Number((gra * factor).toFixed(1))
                };
            };

            const agregarAlConsumo = (item) => {
                const itemId = item.id || item.Id;
                const calculo = calcularFactorYDetalle(itemId, item);
                fetch('/api/consumo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        usuarioId: usuario.Id,
                        fecha: fechaHoy,
                        nombre: item.nombre || item.Nombre,
                        medidaTexto: calculo.textoMedida,
                        calorias: calculo.calorias,
                        proteinas: calculo.proteinas,
                        carbohidratos: calculo.carbohidratos,
                        grasas: calculo.grasas
                    })
                })
                    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
                    .then(() => {
                        cargarConsumo();
                        setBusqueda('');
                        setAlimentos([]);
                        setFlashAdded(item.nombre || item.Nombre || '');
                        setTimeout(() => setFlashAdded(''), 2500);
                    })
                    .catch(err => { console.error("Error al guardar consumo:", err); alert(t('saveErr')); });
            };

            const eliminarDelConsumo = (id) => {
                fetch(`/api/consumo/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => cargarConsumo())
                    .catch(err => console.error("Error al eliminar consumo:", err));
            };

            const pick = (o, a, b) => (o[a] !== undefined ? o[a] : (o[b] || 0));
            const totalCalorias = alimentosConsumidos.reduce((s, c) => s + pick(c, 'calorias', 'Calorias'), 0);
            const totalProteinas = alimentosConsumidos.reduce((s, c) => s + pick(c, 'proteinas', 'Proteinas'), 0);
            const totalCarbos = alimentosConsumidos.reduce((s, c) => s + pick(c, 'carbohidratos', 'Carbohidratos'), 0);
            const totalGrasas = alimentosConsumidos.reduce((s, c) => s + pick(c, 'grasas', 'Grasas'), 0);
            const progresoCal = Math.min(100, caloriasMeta > 0 ? (totalCalorias / caloriasMeta) * 100 : 0);

            const objBtn = (key, label) => (
                <button onClick={() => { setObjetivo(key); guardarPerfil({ objetivo: key }); }}
                    className={`py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${objetivo === key ? 'bg-neon-500 text-ink neon-glow' : 'bg-graphite-900 text-graphite-400 border border-graphite-700'}`}>
                    {label}
                </button>
            );

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start pb-24 lg:pb-4">
                    {/* Calculadora */}
                    <div className={`${CARD} p-5`}>
                        <div className="flex items-center space-x-3 mb-4">
                            <div className={ICON_BOX}><Icons.Apple /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">{t('nutCalc')}</h2>
                                <p className="text-graphite-400 text-sm">{t('nutCalcSub')}</p>
                            </div>
                        </div>


                        <div className="mb-4">
                            <label className="text-xs text-graphite-400 block mb-1">{t('actLevel')}</label>
                            <select value={actividad} onChange={(e) => { const v = Number(e.target.value); setActividad(v); guardarPerfil({ actividad: v }); }}
                                className={`w-full ${INPUT} p-2.5 text-sm font-bold`}>
                                <option value={1.2}>{t('act1')}</option>
                                <option value={1.375}>{t('act2')}</option>
                                <option value={1.55}>{t('act3')}</option>
                                <option value={1.725}>{t('act4')}</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-3 gap-2 mb-4">
                            {objBtn('definicion', t('cut'))}
                            {objBtn('mantenimiento', t('maint'))}
                            {objBtn('volumen', t('bulk'))}
                        </div>

                        <div className="p-4 bg-graphite-900 rounded-xl border border-graphite-700 text-center mb-4">
                            <span className="text-xs text-graphite-400 uppercase tracking-wider font-semibold">{t('goal')}</span>
                            <p className="text-4xl font-black text-neon-500 mt-1">{caloriasMeta} <span className="text-sm font-normal text-graphite-400">kcal</span></p>
                        </div>

                        <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700"><span className="text-[10px] text-graphite-400">{t('protein')}</span><p className="text-sm font-bold text-neon-500">{proteinasMeta}g</p></div>
                            <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700"><span className="text-[10px] text-graphite-400">{t('carbs')}</span><p className="text-sm font-bold text-white">{carbosMeta}g</p></div>
                            <div className="bg-graphite-900 p-2.5 rounded-xl border border-graphite-700"><span className="text-[10px] text-graphite-400">{t('fats')}</span><p className="text-sm font-bold text-graphite-300">{grasasMeta}g</p></div>
                        </div>
                    </div>

                    {/* Registro */}
                    <div className={`${CARD} p-5 sm:p-6`}>
                        <div className="flex items-center space-x-3 mb-4">
                            <div className={ICON_BOX}><Icons.Utensils /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">{t('nutLog')}</h2>
                                <p className="text-graphite-400 text-sm">{t('nutLogSub')}</p>
                            </div>
                        </div>

                        <input type="text" placeholder={t('foodPh')} value={busqueda} onChange={(e) => buscarAlimentos(e.target.value)}
                            className={`w-full ${INPUT} px-4 py-3 mb-4`} />

                        {cargando && <p className="text-xs text-graphite-400 text-center py-2">{t('searching')}</p>}
                        {flashAdded && <p className="text-xs text-neon-500 font-bold text-center py-2 fade-up">✓ {t('added')}: {flashAdded}</p>}

                        {alimentos.length > 0 && (
                            <div className="max-h-[50vh] lg:max-h-96 overflow-y-auto space-y-3 mb-6 bg-graphite-900/80 p-2 rounded-xl border border-graphite-700">
                                {alimentos.map((item) => {
                                    const itemId = item.id || item.Id;
                                    const nom = item.nombre || item.Nombre;
                                    const cal = item.calorias !== undefined ? item.calorias : item.Calorias;
                                    const pro = item.proteinas !== undefined ? item.proteinas : item.Proteinas;
                                    const car = item.carbohidratos !== undefined ? item.carbohidratos : item.Carbohidratos;
                                    const gra = item.grasas !== undefined ? item.grasas : item.Grasas;
                                    const cant = cantidadesInputs[itemId] !== undefined ? cantidadesInputs[itemId] : 100;
                                    const unidad = tiposUnidad[itemId] || 'g';
                                    const calc = calcularFactorYDetalle(itemId, item);

                                    return (
                                        <div key={itemId} className="p-3 bg-graphite-800 rounded-xl border border-graphite-700 space-y-3">
                                            <div>
                                                <h4 className="text-white font-bold text-sm">{nom}</h4>
                                                <p className="text-[10px] text-graphite-400">{t('base100')}: {cal} kcal | P: {pro}g | C: {car}g | G: {gra}g</p>
                                            </div>
                                            <div className="grid grid-cols-12 gap-2 items-center pt-2 border-t border-graphite-700/60">
                                                <div className="col-span-4">
                                                    <input type="number" inputMode="decimal" value={cant} onChange={(e) => handleCantidadChange(itemId, e.target.value)}
                                                        className="w-full bg-graphite-900 text-white font-bold text-center py-1.5 rounded-lg border border-graphite-600 focus:border-neon-500 outline-none text-sm" />
                                                </div>
                                                <div className="col-span-4">
                                                    <select value={unidad} onChange={(e) => handleUnidadChange(itemId, e.target.value)}
                                                        className="w-full bg-graphite-900 text-neon-500 font-bold text-xs py-2 px-1 rounded-lg border border-graphite-600 outline-none">
                                                        <option value="g">{t('grams')}</option>
                                                        <option value="vasos">{t('glasses')}</option>
                                                        <option value="cucharadas">{t('spoons')}</option>
                                                    </select>
                                                </div>
                                                <div className="col-span-4 text-right">
                                                    <span className="text-xs font-bold text-neon-500 block">{calc.calorias} kcal</span>
                                                    <button onClick={() => agregarAlConsumo(item)} className={`w-full mt-1 ${BTN_NEON} text-[11px] py-1.5 rounded-lg`}>{t('add')}</button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="mt-6 border-t border-graphite-700 pt-4">
                            <h3 className="text-white font-bold mb-3">{t('todayIntake')}</h3>

                            <div className="mb-5"><Ring value={totalCalorias} max={caloriasMeta} label={Math.round(totalCalorias)} sub={`/ ${caloriasMeta} kcal`} /></div>

                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {[[t('protein'), totalProteinas, proteinasMeta, 'bg-neon-500'], [t('carbsShort'), totalCarbos, carbosMeta, 'bg-graphite-300'], [t('fats'), totalGrasas, grasasMeta, 'bg-graphite-500']].map(([l, v, m, bar], i) => (
                                    <div key={i} className="bg-graphite-900 p-3 rounded-2xl border border-graphite-700">
                                        <span className="text-[10px] text-graphite-400">{l}</span>
                                        <p className="text-sm font-bold text-white mt-0.5 tabular-nums">{Math.round(v)}<span className="text-[10px] text-graphite-500 font-normal"> / {m}g</span></p>
                                        <div className="h-1.5 bg-graphite-700 rounded-full mt-2 overflow-hidden">
                                            <div className={`h-full rounded-full ${bar} transition-all duration-700`} style={{ width: `${Math.min(100, m > 0 ? (v / m) * 100 : 0)}%` }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="space-y-2">
                                {alimentosConsumidos.length === 0 ? (
                                    <p className="text-xs text-graphite-500 text-center py-2">{t('noFood')}</p>
                                ) : (
                                    alimentosConsumidos.map((c) => {
                                        const cId = c.id || c.Id;
                                        const cNom = c.nombre || c.Nombre;
                                        const cMed = c.medidatexto || c.MedidaTexto;
                                        return (
                                            <div key={cId} className="flex justify-between items-center gap-2 bg-graphite-900 p-3 rounded-xl text-xs border border-graphite-700/50">
                                                <div className="min-w-0">
                                                    <div className="flex items-center flex-wrap gap-x-2 gap-y-1">
                                                        <span className="text-white font-bold">{cNom}</span>

                fetch(`/api/usuario/${usuario.Id}/config`).then(r => (r.ok ? r.json() : null)).then(d => { if (d && d.config && d.config.nombresDias) setDayNames(d.config.nombresDias); }).catch(() => {});
            }, []);
            const dayLabel = (d) => ((dayNames[d] || '').trim() || `${t('day')} ${d}`);
            const [routines, setRoutines] = useState({});
            const [selectedDay, setSelectedDay] = useState(1);
            const [selectedExercise, setSelectedExercise] = useState('');
            const [historialData, setHistorialData] = useState([]);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

                fetch(`/api/rutinas?usuarioId=${usuario.Id}`)
                    .then(res => res.json())

                        const formatted = {};
                        (Array.isArray(data) ? data : []).forEach(item => {

                            const nombreEj = item.nombreep || item.nombreejercicio || item.NombreEjercicio;

                            formatted[dia].push(nombreEj);
                        });
                        setRoutines(formatted);
                        if (formatted[1] && formatted[1].length > 0) setSelectedExercise(formatted[1][0]);

                    .catch(err => console.error("Error al cargar rutinas en progreso:", err));
            }, []);

            const handleDayChange = (day) => {
                setSelectedDay(day);
                const ejercicios = routines[day] || [];

                    data: {
                        labels,
                        datasets: [{
                            label: t('chartLabel'),
                            data: pesos,
                            borderColor: light ? '#5aa800' : '#a3ff12',
                            backgroundColor: light ? 'rgba(90, 168, 0, 0.14)' : 'rgba(163, 255, 18, 0.15)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0,
                            pointBackgroundColor: light ? '#5aa800' : '#a3ff12',
                            pointBorderColor: light ? '#ffffff' : '#0e0f11',

                            pointHoverRadius: 8

                        }
                    }
                });
                return () => { if (chartInstance.current) { chartInstance.current.destroy(); chartInstance.current = null; } };
            }, [historialData]);

            const pesosArr = historialData.map(i => Number(i.pesomaximo !== undefined ? i.pesomaximo : i.PesoMaximo) || 0);
            const maxP = pesosArr.length ? Math.max(...pesosArr) : 0;
            const gain = pesosArr.length > 1 ? pesosArr[pesosArr.length - 1] - pesosArr[0] : 0;
            const diasDisponibles = Object.keys(routines);
            const ejerciciosDelDia = routines[selectedDay] || [];

            return (
                <div className="space-y-6 pb-24 lg:pb-4">
                    <div className={`${CARD} p-5 sm:p-6`}>
                        <div className="flex items-center space-x-3 mb-4">
                            <div className={ICON_BOX}><Icons.TrendingUp /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">{t('evoTitle')}</h2>
                                <p className="text-graphite-400 text-sm">{t('evoSub')}</p>
                            </div>
                        </div>

                        <div className="mb-4">
                            <label className="text-xs text-graphite-400 block mb-1">{t('selDay')}</label>
                            <div className="flex flex-wrap gap-2">
                                {diasDisponibles.length === 0 ? (
                                    <p className="text-xs text-graphite-500">{t('noRoutines')}</p>
                                ) : (
                                    diasDisponibles.map(dia => (
                                        <button key={dia} onClick={() => handleDayChange(Number(dia))}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer ${
                                                selectedDay === Number(dia)
                                                    ? 'bg-neon-500 text-ink neon-glow'
                                                    : 'bg-graphite-900 text-graphite-400 border border-graphite-700 hover:border-graphite-500'
                                            }`}>
                                            {dayLabel(dia)}
                                        </button>
                                    ))
                                )}
                            </div>
                        </div>

                        <div className="mb-6">
                            <label className="text-xs text-graphite-400 block mb-1">{t('selEx')}</label>
                            <select value={selectedExercise} onChange={(e) => setSelectedExercise(e.target.value)}
                                className={`w-full ${INPUT} p-3 text-sm font-bold`}>
                                {ejerciciosDelDia.length === 0 ? (
                                    <option value="">{t('noExDay')}</option>
                                ) : (
                                    ejerciciosDelDia.map((ejer, idx) => <option key={idx} value={ejer}>{ejer}</option>)
                                )}
                            </select>
                        </div>

                        {historialData.length > 0 && (
                            <div className="stagger grid grid-cols-3 gap-2 mb-4">
                                {[[t('statMax'), `${maxP} kg`], [t('statSessions'), pesosArr.length], [t('statGain'), `${gain > 0 ? '+' : ''}${gain} kg`]].map(([l, v], i) => (
                                    <div key={i} className="bg-graphite-900 border border-graphite-700 rounded-2xl p-3 text-center">
                                        <p className="text-[10px] text-graphite-400">{l}</p>
                                        <p className={`text-lg font-black tabular-nums ${i === 2 && gain > 0 ? 'text-neon-500' : 'text-white'}`}>{v}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="bg-graphite-900 p-4 rounded-xl border border-graphite-700">
                            {!selectedExercise || historialData.length === 0 ? (
                                <p className="text-center text-graphite-500 py-10 text-xs">{t('progEmpty')}</p>
                            ) : (
                                <div className="relative h-64 sm:h-80 lg:h-96"><canvas ref={chartRef}></canvas></div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };
