        const LangCtx = React.createContext({ t: makeT('es'), lang: 'es' });
        const useT = () => React.useContext(LangCtx);
        const detectLang = () => {
            const l = (navigator.language || 'es').slice(0, 2);
            return ['es', 'pt', 'en'].includes(l) ? l : 'es';
        };

        // ====================================================
        // CRONÓMETRO (persistente: guarda startedAt y calcula con Date.now())
        // ====================================================
        const CRONO_KEY = 'ruko_crono';
        const EMPTY_CRONO = { startedAt: null, acc: 0, laps: [] };
        const readCrono = () => {
            try { return { ...EMPTY_CRONO, ...JSON.parse(localStorage.getItem(CRONO_KEY)) }; }
            catch (e) { return { ...EMPTY_CRONO }; }
        };
        const fmtTime = (ms) => {
            const s = Math.floor(ms / 1000);
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
            return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        };
        // Solo el componente que lo usa se re-renderiza en cada tick
        const useElapsed = (c, every) => {
            const [now, setNow] = useState(Date.now());
            useEffect(() => {
                setNow(Date.now());
                if (!c.startedAt) return;
                const id = setInterval(() => setNow(Date.now()), every);
                const onVis = () => setNow(Date.now());
                document.addEventListener('visibilitychange', onVis);
                return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVis); };
            }, [c.startedAt, every]);
            return c.acc + (c.startedAt ? Math.max(0, now - c.startedAt) : 0);
        };
        const useCrono = () => {
            const [c, setC] = useState(readCrono);
            const persist = (n) => { localStorage.setItem(CRONO_KEY, JSON.stringify(n)); setC(n); };
            const elapsedNow = () => c.acc + (c.startedAt ? Date.now() - c.startedAt : 0);
            return {
                c,
                running: !!c.startedAt,
                active: !!c.startedAt || c.acc > 0,
                start: () => persist({ ...c, startedAt: Date.now() }),
                pause: () => persist({ ...c, startedAt: null, acc: elapsedNow() }),
                reset: () => persist({ ...EMPTY_CRONO }),
                lap: () => persist({ ...c, laps: [...c.laps, elapsedNow()] })
            };
        };

        const CronoEffects = ({ c, notifEnabled, label }) => {
            const el = useElapsed(c, 1000);
            useEffect(() => { document.title = c.startedAt ? `⏱ ${fmtTime(el)} · RUKO` : 'RUKO'; }, [el, c.startedAt]);
            useEffect(() => () => { document.title = 'RUKO'; }, []);
            useEffect(() => {
                const onHide = () => {
                    if (!document.hidden || !c.startedAt || !notifEnabled) return;
                    if (!('Notification' in window) || Notification.permission !== 'granted') return;
                    try { new Notification('RUKO', { body: `${label}: ${fmtTime(c.acc + Date.now() - c.startedAt)}`, tag: 'ruko-crono' }); } catch (e) {}
                };
                document.addEventListener('visibilitychange', onHide);
                return () => document.removeEventListener('visibilitychange', onHide);
            }, [c.startedAt, c.acc, notifEnabled, label]);
            return null;
        };

        const CronoBanner = ({ c, onClick, label }) => {
            const el = useElapsed(c, 1000);
            return (
                <button onClick={onClick} className="max-w-5xl mx-auto mt-3 w-full flex items-center justify-between bg-neon-500 text-ink rounded-xl px-4 py-2 text-sm font-bold neon-glow cursor-pointer">
                    <span className="flex items-center gap-2">
                        <span className={`w-2 h-2 rounded-full bg-ink ${c.startedAt ? 'animate-pulse' : 'opacity-40'}`}></span>{label}
                    </span>
                    <span className="tabular-nums">{fmtTime(el)}</span>
                </button>
            );
        };

        const BigTime = ({ c }) => {
            const el = useElapsed(c, 50);
            const cs = String(Math.floor((el % 1000) / 10)).padStart(2, '0');
            const R = 108, C = 2 * Math.PI * R;
            const sec = (el % 60000) / 60000;
            return (
                <div className="relative w-64 h-64 sm:w-72 sm:h-72 mx-auto">
                    <svg viewBox="0 0 240 240" className="w-full h-full -rotate-90">
                        <circle cx="120" cy="120" r={R} fill="none" strokeWidth="8" className="stroke-graphite-700" />
                        <circle cx="120" cy="120" r={R} fill="none" strokeWidth="8" strokeLinecap="round" stroke="currentColor" className="text-neon-500"
                            strokeDasharray={C} strokeDashoffset={C * (1 - sec)}
                            style={{ filter: c.startedAt ? 'drop-shadow(0 0 8px rgba(163,255,18,0.6))' : 'none' }} />
                    </svg>
                    <div className="absolute inset-0 flex items-center justify-center tabular-nums">
                        <div className="text-center">
                            <span className="text-5xl sm:text-6xl font-black text-white">{fmtTime(el)}</span>
                            <span className="text-xl font-bold text-neon-500">.{cs}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const TimerTab = ({ crono }) => {
            const { t } = useT();
            const { c, running, active } = crono;
            const lapsRev = c.laps.map((total, i) => ({ n: i + 1, total, split: total - (i > 0 ? c.laps[i - 1] : 0) })).reverse();
            const sm = "py-3 rounded-xl bg-graphite-700 text-white font-bold text-sm disabled:opacity-40 cursor-pointer flex items-center justify-center gap-1.5";
            return (
                <div className="max-w-md mx-auto space-y-6 pb-24 lg:pb-4">
                    <div className={`${CARD} p-6`}>
                        <div className="flex items-center space-x-3 mb-8">
                            <div className={ICON_BOX}><Icons.Timer /></div>
                            <div>
                                <h2 className="text-xl font-bold text-white">{t('navTimer')}</h2>
                                <p className="text-graphite-400 text-sm">{t('tmSub')}</p>
                            </div>
                        </div>
                        <BigTime c={c} />
                        <div className="grid grid-cols-3 gap-3 mt-8">
                            <button onClick={crono.reset} disabled={!active} className={sm}><Icons.Reset />{t('reset')}</button>
                            <button onClick={running ? crono.pause : crono.start} className={`${BTN_NEON} py-3 rounded-xl text-sm neon-glow flex items-center justify-center gap-1.5`}>
                                {running ? <Icons.Pause /> : <Icons.Play />}{running ? t('pause') : (c.acc > 0 ? t('resume') : t('start'))}
                            </button>
                            <button onClick={crono.lap} disabled={!running} className={sm}><Icons.Flag />{t('lap')}</button>
                        </div>
                    </div>
                    <div className={`${CARD} p-5`}>
                        <h3 className="text-white font-bold mb-3">{t('laps')}</h3>
                        {lapsRev.length === 0 ? (
                            <p className="text-xs text-graphite-500 text-center py-2">{t('noLaps')}</p>
                        ) : (
                            <div className="space-y-2 max-h-72 overflow-y-auto hide-scrollbar">
                                {lapsRev.map(l => (
                                    <div key={l.n} className="flex justify-between items-center bg-graphite-900 px-3 py-2 rounded-xl border border-graphite-700/50 text-sm tabular-nums">
                                        <span className="text-graphite-400 font-bold">#{l.n}</span>
                                        <span className="text-neon-500 font-bold">+{fmtTime(l.split)}</span>
                                        <span className="text-white">{fmtTime(l.total)}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ====================================================
        // AJUSTES
        // ====================================================
        const Avatar = ({ usuario, size = 36 }) => {
            const foto = usuario.Foto || usuario.foto;
            const nombre = usuario.nombre || usuario.Nombre || '?';
            return foto ? (
                <img src={foto} alt="" style={{ width: size, height: size }} className="rounded-full object-cover border border-neon-500/50 shrink-0" />
            ) : (
                <div style={{ width: size, height: size }} className="rounded-full bg-neon-500 text-ink font-black flex items-center justify-center shrink-0">
                    <span style={{ fontSize: size * 0.42 }}>{nombre.charAt(0).toUpperCase()}</span>
                </div>
            );
        };

        const Switch = ({ on, onChange }) => (
            <button onClick={onChange} className={`w-12 h-7 rounded-full p-1 transition-colors cursor-pointer shrink-0 ${on ? 'bg-neon-500' : 'bg-graphite-600'}`}>
                <span className={`block w-5 h-5 rounded-full bg-white shadow transition-transform ${on ? 'translate-x-5' : ''}`}></span>
            </button>
        );

        const Seg = ({ options, value, onChange }) => (
            <div className="grid gap-2" style={{ gridTemplateColumns: `repeat(${options.length}, 1fr)` }}>
                {options.map(([v, l]) => (
                    <button key={v} onClick={() => onChange(v)}
                        className={`py-2 rounded-xl text-xs font-bold cursor-pointer transition-all ${value === v ? 'bg-neon-500 text-ink neon-glow' : 'bg-graphite-900 text-graphite-400 border border-graphite-700'}`}>
                        {l}
                    </button>
                ))}
            </div>
        );

        const HowModal = ({ onClose, onboarding, usuario, setUsuario }) => {
            const { t } = useT();
            const slides = 5;
            const total = onboarding ? slides + 1 : slides;
            const hasDefaults = usuario && Number(usuario.Peso) === 75 && Number(usuario.Altura) === 175 && Number(usuario.Edad) === 20;
            const [i, setI] = useState(0);
            const [form, setForm] = useState(() => (onboarding && usuario && !hasDefaults)
                ? { peso: String(usuario.Peso || ''), altura: String(usuario.Altura || ''), edad: String(usuario.Edad || '') }
                : { peso: '', altura: '', edad: '' });
            const [err, setErr] = useState('');
            const [saving, setSaving] = useState(false);
            const isForm = onboarding && i === slides;
            const StepIcon = [Icons.Dumbbell, Icons.Calendar, Icons.Apple, Icons.TrendingUp, Icons.Timer, Icons.User][i];

            const save = () => {
                const p = Number(String(form.peso).replace(',', '.')), a = Number(form.altura), e = Number(form.edad);
                if (!(p >= 20 && p <= 300) || !(a >= 100 && a <= 250) || !(e >= 10 && e <= 100)) { setErr(t('fillData')); return; }
                setSaving(true);
                fetch(`/api/usuario/${usuario.Id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ peso: p, altura: a, edad: e, actividad: usuario.Actividad || 1.55, objetivo: usuario.Objetivo || 'mantenimiento' })
                })
                    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(() => {
                        const u = { ...usuario, Peso: p, peso: p, Altura: a, altura: a, Edad: e, edad: e };
                        localStorage.setItem('fitpro_usuario', JSON.stringify(u));
                        setUsuario(u);
                        onClose();
                    })
                    .catch(() => { setSaving(false); setErr(t('saveErr')); });
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-4" onClick={onboarding ? undefined : onClose}>
                    <div className={`${CARD} w-full max-w-md p-6 max-h-[92vh] overflow-y-auto fade-up`} onClick={(e) => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-5">
                            <h3 className="text-white font-bold">{onboarding ? t('welcome') : t('how')}</h3>
                            {!onboarding && <button onClick={onClose} className="text-xs text-graphite-400 hover:text-white cursor-pointer">{t('close')}</button>}
                        </div>

                        {isForm ? (
                            <div className="py-2 min-h-[190px]">
                                <div className="text-center mb-5">
                                    <div className="inline-flex text-neon-500 bg-neon-500/10 p-4 rounded-full mb-3"><StepIcon /></div>
                                    <h4 className="text-xl font-bold text-white mb-1">{t('aboutYou')}</h4>
                                    <p className="text-sm text-graphite-300 leading-relaxed">{t('aboutYouSub')}</p>
                                </div>
                                <div className="grid grid-cols-3 gap-3">
                                    {[['peso', t('weight')], ['altura', t('height')], ['edad', t('age')]].map(([k, l]) => (
                                        <div key={k}>
                                            <label className="text-xs text-graphite-400 block mb-1">{l}</label>
                                            <input type="number" inputMode="decimal" value={form[k]}
                                                onChange={(e) => { setForm({ ...form, [k]: e.target.value }); setErr(''); }}
                                                className={`w-full ${INPUT} p-3 font-bold text-center`} />
                                        </div>
                                    ))}
                                </div>
                                {err && <p className="text-xs text-red-400 font-semibold mt-3">{err}</p>}
                            </div>
                        ) : (
                            <div className="text-center py-4 min-h-[190px]">
                                <div className="inline-flex text-neon-500 bg-neon-500/10 p-4 rounded-full mb-4"><StepIcon /></div>
                                <h4 className="text-xl font-bold text-white mb-2">{t(`h${i + 1}t`)}</h4>
                                <p className="text-sm text-graphite-300 leading-relaxed">{t(`h${i + 1}d`)}</p>
                            </div>
                        )}

                        <div className="flex justify-center gap-1.5 my-5">
                            {Array.from({ length: total }, (_, k) => (
                                <span key={k} className={`h-1.5 rounded-full transition-all ${k === i ? 'w-6 bg-neon-500' : 'w-1.5 bg-graphite-600'}`}></span>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={() => setI(Math.max(0, i - 1))} disabled={i === 0} className="py-3 rounded-xl bg-graphite-700 text-white font-bold text-sm disabled:opacity-40 cursor-pointer">{t('prev')}</button>
                            {isForm ? (
                                <button onClick={save} disabled={saving} className={`${BTN_NEON} py-3 rounded-xl text-sm disabled:opacity-60`}>{t('letsGo')}</button>
                            ) : (
                                <button onClick={() => (i === total - 1 ? onClose() : setI(i + 1))} className={`${BTN_NEON} py-3 rounded-xl text-sm`}>{i === total - 1 ? t('done') : t('next')}</button>
                            )}
                        </div>
                        {onboarding && !isForm && (
                            <button onClick={() => setI(slides)} className="w-full mt-3 text-xs text-graphite-400 hover:text-white cursor-pointer">{t('skip')}</button>
                        )}
                    </div>
                </div>
            );
        };

        const SettingsTab = ({ usuario, setUsuario, theme, setTheme, lang, setLang, notif, toggleNotif, onLogout }) => {
            const { t } = useT();
            const [peso, setPeso] = useState(usuario.Peso || 75);
            const [altura, setAltura] = useState(usuario.Altura || 175);
            const [edad, setEdad] = useState(usuario.Edad || 20);
            const [flash, setFlash] = useState('');
            const [pw, setPw] = useState({ a: '', n: '', r: '' });
            const [pwMsg, setPwMsg] = useState(null);
            const [howOpen, setHowOpen] = useState(false);
            const fileRef = useRef(null);
            const headers = { 'Content-Type': 'application/json' };

            const persistUser = (u) => { localStorage.setItem('fitpro_usuario', JSON.stringify(u)); setUsuario(u); };

            const saveProfile = () => {
                const p = Number(peso), a = Number(altura), e = Number(edad);
                fetch(`/api/usuario/${usuario.Id}`, {
                    method: 'PUT', headers,
                    body: JSON.stringify({ peso: p, altura: a, edad: e, actividad: usuario.Actividad || 1.55, objetivo: usuario.Objetivo || 'mantenimiento' })
                })
                    .then(r => r.json())
                    .then(() => {
                        persistUser({ ...usuario, Peso: p, peso: p, Altura: a, altura: a, Edad: e, edad: e });
                        setFlash(t('saved'));
                        setTimeout(() => setFlash(''), 2000);
                    })
                    .catch(err => console.error("Error al guardar perfil:", err));
            };

            const onPhoto = (ev) => {
                const f = ev.target.files && ev.target.files[0];
                if (!f) return;
                const url = URL.createObjectURL(f);
                const img = new Image();
                img.onload = () => {
                    const S = 256;
                    const cv = document.createElement('canvas');
                    cv.width = S; cv.height = S;
                    const m = Math.min(img.width, img.height);
                    cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
                    const data = cv.toDataURL('image/jpeg', 0.8);
                    URL.revokeObjectURL(url);
                    fetch(`/api/usuario/${usuario.Id}/foto`, { method: 'PUT', headers, body: JSON.stringify({ foto: data }) })
                        .then(r => r.json())
                        .then(() => persistUser({ ...usuario, Foto: data, foto: data }))
                        .catch(err => console.error("Error al subir foto:", err));
                };
                img.src = url;
                ev.target.value = '';
            };

            const changePassword = () => {
                if (pw.n.length < 6) return setPwMsg({ ok: false, text: t('pwShort') });
                if (pw.n !== pw.r) return setPwMsg({ ok: false, text: t('pwMismatch') });
                fetch(`/api/usuario/${usuario.Id}/password`, { method: 'PUT', headers, body: JSON.stringify({ actual: pw.a, nueva: pw.n }) })
                    .then(async (r) => {
                        if (r.ok) { setPwMsg({ ok: true, text: t('pwOk') }); setPw({ a: '', n: '', r: '' }); }
                        else setPwMsg({ ok: false, text: r.status === 401 ? t('pwWrong') : t('pwErr') });
                    })
                    .catch(() => setPwMsg({ ok: false, text: t('pwErr') }));
            };

            const pwInput = (key, ph) => (
                <input type="password" placeholder={ph} value={pw[key]} onChange={(e) => setPw({ ...pw, [key]: e.target.value })} className={`w-full ${INPUT} px-4 py-3 text-sm`} />
            );

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start pb-24 lg:pb-4">
                    {/* Usuario */}
                    <div className={`${CARD} p-5 space-y-4`}>
                        <h2 className="text-lg font-bold text-white">{t('profile')}</h2>
                        <div className="flex items-center gap-4">
                            <Avatar usuario={usuario} size={72} />
                            <div className="min-w-0">
                                <p className="text-white font-bold truncate">{usuario.nombre || usuario.Nombre}</p>
                                <span className={`inline-block mt-1 text-[10px] font-black tracking-wider uppercase px-2 py-0.5 rounded-full ${(usuario.plan || usuario.Plan) === 'pro' ? 'bg-neon-500 text-ink' : 'bg-graphite-700 text-graphite-300'}`}>{(usuario.plan || usuario.Plan) === 'pro' ? t('planPro') : t('planFree')}</span>
                                <button onClick={() => fileRef.current && fileRef.current.click()} className="text-xs text-neon-500 font-semibold mt-1 cursor-pointer">{t('changePhoto')}</button>
                                <input ref={fileRef} type="file" accept="image/*" onChange={onPhoto} className="hidden" />
                            </div>
                        </div>
                        <div className="grid grid-cols-3 gap-3">
                            {[[t('weight'), peso, setPeso], [t('height'), altura, setAltura], [t('age'), edad, setEdad]].map(([label, val, setter], i) => (
                                <div key={i}>
                                    <label className="text-xs text-graphite-400 block mb-1">{label}</label>
                                    <input type="number" inputMode="decimal" value={val} onChange={(e) => setter(e.target.value)} className={`w-full ${INPUT} p-2 font-bold text-center`} />
                                </div>
                            ))}
                        </div>
                        <button onClick={saveProfile} className={`w-full ${BTN_NEON} py-3 rounded-xl text-sm`}>{flash || t('save')}</button>
                    </div>

                    {/* Contraseña */}
                    <div className={`${CARD} p-5 space-y-3`}>
                        <h2 className="text-lg font-bold text-white">{t('pwTitle')}</h2>
                        {pwInput('a', t('pwCurrent'))}
                        {pwInput('n', t('pwNew'))}
                        {pwInput('r', t('pwRepeat'))}
                        {pwMsg && <p className={`text-xs font-semibold ${pwMsg.ok ? 'text-neon-500' : 'text-red-400'}`}>{pwMsg.text}</p>}
                        <button onClick={changePassword} className={`w-full ${BTN_NEON} py-3 rounded-xl text-sm`}>{t('pwUpdate')}</button>
                    </div>

                    {/* Preferencias */}
                    <div className={`${CARD} p-5 space-y-5`}>
                        <div>
                            <label className="text-xs text-graphite-400 block mb-2 uppercase tracking-wider font-bold">{t('theme')}</label>
                            <Seg value={theme} onChange={setTheme} options={[['dark', t('dark')], ['light', t('light')]]} />
                        </div>
                        <div>
                            <label className="text-xs text-graphite-400 block mb-2 uppercase tracking-wider font-bold">{t('language')}</label>
                            <Seg value={lang} onChange={setLang} options={[['es', 'Castellano'], ['pt', 'Português'], ['en', 'English']]} />
                        </div>
                        <div className="flex items-center justify-between gap-4">
                            <div>
                                <p className="text-white font-bold text-sm">{t('notifications')}</p>
                                <p className="text-xs text-graphite-400">{t('notifSub')}</p>
                            </div>
                            <Switch on={notif} onChange={toggleNotif} />
                        </div>
                    </div>

                    {/* Cómo funciona + salir */}
                    <div className={`${CARD} p-5 space-y-3`}>
                        <button onClick={() => setHowOpen(true)} className="w-full flex items-center justify-between text-left cursor-pointer">
                            <div>
                                <p className="text-white font-bold">{t('how')}</p>
                                <p className="text-xs text-graphite-400">{t('howSub')}</p>
                            </div>
                            <span className="text-neon-500 font-black text-xl">›</span>
                        </button>
                        <button onClick={onLogout} className={`w-full py-3 rounded-xl text-sm font-bold ${BTN_DANGER}`}>{t('logout')}</button>
                    </div>

                    {howOpen && <HowModal onClose={() => setHowOpen(false)} />}
                </div>
            );
        };

        // ====================================================
        // APP
        // ====================================================
        const App = () => {
            const [usuario, setUsuario] = useState(() => {
                const saved = localStorage.getItem('fitpro_usuario');
                return saved ? JSON.parse(saved) : null;
            });
            const [pantallaAuth, setPantallaAuth] = useState('login');
            const [nombreInput, setNombreInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [activeTab, setActiveTab] = useState('training');
            const [lang, setLangState] = useState(() => localStorage.getItem('ruko_lang') || detectLang());
            const [theme, setThemeState] = useState(() => localStorage.getItem('ruko_theme') || 'dark');
            const [notif, setNotif] = useState(() => localStorage.getItem('ruko_notif') === 'on');
            const [onboard, setOnboard] = useState(false);
            const crono = useCrono();
            const t = makeT(lang);

            useEffect(() => {
                document.documentElement.classList.toggle('light', theme === 'light');
                const meta = document.querySelector('meta[name=theme-color]');
                if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f5ef' : '#0e0f11');
            }, [theme]);
            useEffect(() => { document.documentElement.lang = lang; }, [lang]);
            useEffect(() => {
                if (usuario && usuario.Id && !localStorage.getItem(`ruko_onboarded_${usuario.Id}`)) setOnboard(true);
            }, [usuario ? usuario.Id : null]);

            // Sincroniza el perfil (foto incluida) con el servidor al abrir y al volver a la app
            useEffect(() => {
                if (!usuario || !usuario.Id) return;
                const id = usuario.Id;
                const refresh = () => {
                    fetch(`/api/usuario/${id}`)
                        .then(r => (r.ok ? r.json() : null))
                        .then(d => {
                            if (!d || !d.usuario) return;
                            const srv = { ...d.usuario };
                            let cached = null;
                            try { cached = JSON.parse(localStorage.getItem('fitpro_usuario') || 'null'); } catch (e) {}
                            const srvFoto = srv.Foto || srv.foto;
                            const locFoto = cached && cached.Id === id ? (cached.Foto || cached.foto) : null;
                            // Si la foto solo existía en este dispositivo, se sube al servidor
                            if (!srvFoto && locFoto) {
                                fetch(`/api/usuario/${id}/foto`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ foto: locFoto }) }).catch(() => {});
                                srv.Foto = locFoto; srv.foto = locFoto;
                            }
                            setUsuario(prev => {
                                if (!prev || prev.Id !== id) return prev;
                                const next = { ...prev, ...srv };
                                if (JSON.stringify(next) === JSON.stringify(prev)) return prev;
                                localStorage.setItem('fitpro_usuario', JSON.stringify(next));
                                return next;
                            });
                        })
                        .catch(() => {});
                };
                refresh();
                const onVis = () => { if (!document.hidden) refresh(); };
                document.addEventListener('visibilitychange', onVis);
                return () => document.removeEventListener('visibilitychange', onVis);
            }, [usuario ? usuario.Id : null]);

            const setLang = (l) => { setLangState(l); localStorage.setItem('ruko_lang', l); };
            const setTheme = (th) => { setThemeState(th); localStorage.setItem('ruko_theme', th); };

            const toggleNotif = async () => {
                if (notif) { setNotif(false); localStorage.setItem('ruko_notif', 'off'); return; }
                if (!('Notification' in window)) { alert(t('notifUnsupported')); return; }
                let perm = Notification.permission;
                if (perm !== 'granted') perm = await Notification.requestPermission();
                if (perm !== 'granted') { alert(t('notifDenied')); return; }
                setNotif(true);
                localStorage.setItem('ruko_notif', 'on');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre: nombreInput, password: passwordInput })
                    });
                    const data = await res.json();
                    if (data.success) {
                        setUsuario(data.usuario);
                        localStorage.setItem('fitpro_usuario', JSON.stringify(data.usuario));
                    } else {
                        alert(res.status === 401 ? t('errCreds') : (data.error || t('errCreds')));
                    }
                } catch (err) {
                    console.error("Error en login:", err);
                    alert(t('errConn'));
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre: nombreInput, password: passwordInput })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(t('regOk'));
                        setPantallaAuth('login');
                        setNombreInput(''); setPasswordInput('');
                    } else {
                        alert(data.error || t('regErr'));
                    }
                } catch (err) {
                    console.error("Error en registro:", err);
                    alert(t('errConn'));
                }
            };

            const handleLogout = () => {
                setUsuario(null);
                setActiveTab('training');
                localStorage.removeItem('fitpro_usuario');
            };

            const ctx = { t, lang };

            if (!usuario) {
                const esLogin = pantallaAuth === 'login';
                return (
                    <LangCtx.Provider value={ctx}>
                        <div className="flex flex-col items-center justify-center min-h-[100dvh] bg-graphite-950 text-white p-4">
                            <div className="w-full max-w-sm bg-graphite-900 p-6 rounded-3xl border border-graphite-800 shadow-xl space-y-4 fade-up">
                                <h1 className="text-3xl font-black text-neon-500 text-center tracking-tight">RUKO</h1>
                                <form onSubmit={esLogin ? handleLogin : handleRegister} className="space-y-3">
                                    <input type="text" placeholder={t('yourName')} value={nombreInput} onChange={e => setNombreInput(e.target.value)}
                                        className="w-full bg-graphite-800 p-3 rounded-lg border border-graphite-700 text-sm outline-none focus:border-neon-500" required />
                                    <input type="password" placeholder={t('password')} value={passwordInput} onChange={e => setPasswordInput(e.target.value)}
                                        className="w-full bg-graphite-800 p-3 rounded-lg border border-graphite-700 text-sm outline-none focus:border-neon-500" required />
                                    <button type="submit" className={`w-full ${BTN_NEON} p-3 rounded-lg text-sm`}>{esLogin ? t('login') : t('register')}</button>
                                    <p className="text-xs text-center text-graphite-400 cursor-pointer pt-2 hover:text-neon-500"
                                        onClick={() => { setPantallaAuth(esLogin ? 'registro' : 'login'); setNombreInput(''); setPasswordInput(''); }}>
                                        {esLogin ? t('noAcc') : t('haveAcc')}
                                    </p>
                                </form>
                                <div className="pt-2"><Seg value={lang} onChange={setLang} options={[['es', 'ES'], ['pt', 'PT'], ['en', 'EN']]} /></div>
                            </div>
                        </div>
                    </LangCtx.Provider>
                );
            }

            const nombreUsuario = usuario.nombre || usuario.Nombre;
            const navItems = [
                { id: 'training', label: t('navTraining'), Icon: Icons.Dumbbell },
                { id: 'nutrition', label: t('navNutrition'), Icon: Icons.Flame },
                { id: 'progress', label: t('navProgress'), Icon: Icons.TrendingUp },
                { id: 'timer', label: t('navTimer'), Icon: Icons.Timer },
            ];
            const bannerLabel = crono.running ? t('running') : t('paused');

            return (
                <LangCtx.Provider value={ctx}>
                    <div className="min-h-[100dvh] bg-graphite-950 font-sans">
                        <CronoEffects c={crono.c} notifEnabled={notif} label={t('running')} />
                        {onboard && (
                            <HowModal onboarding usuario={usuario} setUsuario={setUsuario}
                                onClose={() => { localStorage.setItem(`ruko_onboarded_${usuario.Id}`, '1'); setOnboard(false); }} />
                        )}

                        {/* Sidebar (desktop) */}
                        <aside className="hidden lg:flex fixed inset-y-0 left-0 w-60 flex-col bg-graphite-900 border-r border-graphite-800 p-5 z-20">
                            <h1 className="text-2xl font-black text-neon-500 tracking-tight">RUKO</h1>
                            <nav className="mt-8 space-y-1">
                                {navItems.map(({ id, label, Icon }) => (
                                    <button key={id} onClick={() => setActiveTab(id)}
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-colors cursor-pointer ${
                                            activeTab === id ? 'bg-neon-500/10 text-neon-500' : 'text-graphite-400 hover:bg-graphite-800 hover:text-white'
                                        }`}>
                                        <Icon /><span>{label}</span>
                                    </button>
                                ))}
                            </nav>
                            <button onClick={() => setActiveTab('settings')}
                                className={`mt-auto w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-colors cursor-pointer ${
                                    activeTab === 'settings' ? 'bg-neon-500/10 text-neon-500' : 'text-graphite-400 hover:bg-graphite-800 hover:text-white'
                                }`}>
                                <Icons.User /><span>{t('settings')}</span>
                            </button>
                        </aside>

                        <div className="lg:pl-60">
                            <header className="bg-graphite-950/75 backdrop-blur-xl safe-top pb-3 px-4 sm:px-6 border-b border-graphite-800/60 sticky top-0 z-10">
                                <div className="max-w-5xl mx-auto flex justify-between items-center">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <Avatar usuario={usuario} size={44} />
                                        <div className="min-w-0">
                                            <p className="text-[11px] text-graphite-400 leading-none">{t('hello')}</p>
                                            <p className="text-sm font-bold text-white truncate max-w-[34vw] sm:max-w-[50vw] mt-1">{nombreUsuario}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="lg:hidden text-xl font-black tracking-tight text-neon-500">RUKO</span>
                                        <div className="lg:hidden">
                                            <button onClick={() => setActiveTab('settings')} className={`glass-btn ${activeTab === 'settings' ? '!border-neon-500 !text-neon-500' : ''}`}><Icons.User /></button>
                                        </div>
                                    </div>
                                </div>
                                {crono.active && activeTab !== 'timer' && (
                                    <CronoBanner c={crono.c} label={bannerLabel} onClick={() => setActiveTab('timer')} />
                                )}
                            </header>

                            <main key={activeTab} className="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 fade-up">
                                {activeTab === 'training' && <TrainingTab usuario={usuario} />}
                                {activeTab === 'nutrition' && <NutritionTab usuario={usuario} setUsuario={setUsuario} />}
                                {activeTab === 'progress' && <ProgressTab usuario={usuario} />}
                                {activeTab === 'timer' && <TimerTab crono={crono} />}
                                {activeTab === 'settings' && (
                                    <SettingsTab usuario={usuario} setUsuario={setUsuario} theme={theme} setTheme={setTheme}
                                        lang={lang} setLang={setLang} notif={notif} toggleNotif={toggleNotif} onLogout={handleLogout} />
                                )}
                            </main>
                        </div>

                        {/* Barra inferior (móvil y tablet) */}
                        <nav className="lg:hidden fixed inset-x-4 bottom-3 z-20 safe-bottom">
                            <div className="max-w-md mx-auto flex items-center justify-around p-2 rounded-[28px] bg-graphite-900/80 backdrop-blur-xl border border-graphite-700 shadow-2xl">
                                {navItems.map(({ id, label, Icon }) => (
                                    <button key={id} onClick={() => setActiveTab(id)}
                                        className={`flex items-center gap-2 px-4 py-3 rounded-2xl transition-all duration-300 cursor-pointer ${activeTab === id ? 'bg-neon-500 text-ink font-bold neon-glow' : 'text-graphite-400'}`}>
                                        <Icon />{activeTab === id && <span className="text-xs">{label}</span>}
                                    </button>
                                ))}
                            </div>
                        </nav>
                    </div>
                </LangCtx.Provider>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) ReactDOM.createRoot(rootElement).render(<App />);
    </script>
</body>
</html>
